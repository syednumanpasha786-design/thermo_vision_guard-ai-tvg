        '<span class="chip glass-soft mt-1.5 text-ember">'+esc(u.role||"Officer")+'</span></div></div>'+
        '<div class="mt-6 grid gap-2.5 sm:grid-cols-2">'+
          row("Feed status","NASA FIRMS \u00B7 "+(DATA.pass||"")+" \u00B7 dataset "+(DATA.scenario+1)+" of "+SCENARIOS.length)+
          row("Sensors",DATA.sources.length?esc(DATA.sources.join(", ")):esc(FIRMS_SRC.join(", ")))+
          row("Coverage","India first, then global")+
          row("Cluster grid","~"+Math.round(CLUSTER_DEG*111)+" km")+
          row("Report engine","On-device incident writer")+
          row("Last refresh",DATA.fetchedAt?fmtTime(DATA.fetchedAt):"not yet")+
        '</div></div>'+
      '<div class="space-y-3">'+
        '<div class="rv glass rounded-2xl p-5 text-center"><img src="'+LOGO_MARK+'" class="mx-auto h-20 w-20 rounded-2xl object-cover" alt="TVG">'+
        '<p class="mt-3 font-display text-[14px] font-semibold"><span class="ember-text">THERMO</span>VISION GUARD AI</p>'+
        '<p class="mt-1.5 text-[11px] text-dim">Fire data courtesy NASA FIRMS. Land use &#169; OpenStreetMap contributors.</p></div>'+
        '<button data-a="refresh" class="btn-fluid w-full py-3 text-[13px] font-semibold text-dim">&#8635; Refresh satellite feed</button>'+
        '<button data-a="signout" class="btn-fluid w-full py-3 text-[13px] font-semibold" style="color:hsl(var(--danger))">Sign out</button>'+
      '</div></div></div>');
}

/* ============================== PDF ============================== */
function makePDF(id){
  const h=(id==="manual"&&S.manual)?S.manual:hotspots().find(x=>x.id===id);
  if(!h) return;
  if(!window.jspdf||!window.jspdf.jsPDF){ alert("PDF library did not load. Check your connection."); return; }
  const doc=new window.jspdf.jsPDF(), W=doc.internal.pageSize.getWidth(), Hh=doc.internal.pageSize.getHeight();
  const nat=h.nature||fireNature(h), ft=h.fireType||fireType(h), d=h.deptInfo||DEPT.fire;
  let y=0;

  doc.setFillColor(9,11,16); doc.rect(0,0,W,34,"F");
  doc.setFillColor(255,122,26); doc.rect(0,34,W,1.4,"F");
  doc.setTextColor(255,122,26); doc.setFont("helvetica","bold"); doc.setFontSize(15);
  doc.text("THERMOVISION GUARD AI",14,15);
  doc.setTextColor(228,228,228); doc.setFont("helvetica","normal"); doc.setFontSize(8.6);
  doc.text("Satellite thermal incident report  |  Source: NASA FIRMS (VIIRS / MODIS)",14,23);
  doc.setFontSize(7.6); doc.setTextColor(170,170,170);
  doc.text("Ref TVG/"+String(h.id).replace(/[^A-Za-z0-9]/g,"").toUpperCase().slice(0,12)+"/"+new Date().getFullYear(),14,29.5);
  doc.text(fmtTime(new Date().toISOString()),W-14,29.5,{align:"right"});

  const rk=h.risk_level==="High"?[220,53,45]:h.risk_level==="Medium"?[240,150,30]:[120,130,145];
  doc.setFillColor(rk[0],rk[1],rk[2]); doc.roundedRect(14,44,W-28,13,2.5,2.5,"F");
  doc.setTextColor(255,255,255); doc.setFont("helvetica","bold"); doc.setFontSize(10.5);
  doc.text(h.classification.toUpperCase()+"   |   "+h.risk_level.toUpperCase()+" RISK   |   "+nat.label.toUpperCase(),18,52.6);

  doc.setTextColor(20,20,20); doc.setFont("helvetica","bold"); doc.setFontSize(13.5);
  doc.text(String(h.nearby_facility).slice(0,58),14,68);
  doc.setFont("helvetica","normal"); doc.setFontSize(9);
  doc.setTextColor(90,90,90);
  doc.text(String(h.address||placeOf(h)).slice(0,92),14,74.5);
  y=84;

  function section(title){
    if(y>Hh-32){ doc.addPage(); y=22; }
    doc.setDrawColor(230,230,230); doc.line(14,y-4,W-14,y-4);
    doc.setTextColor(255,122,26); doc.setFont("helvetica","bold"); doc.setFontSize(9.4);
    doc.text(title.toUpperCase(),14,y); y+=6.5;
    doc.setTextColor(35,35,35); doc.setFont("helvetica","normal"); doc.setFontSize(9);
  }
  function pair(k,v){
    if(y>Hh-20){ doc.addPage(); y=22; }
    doc.setFont("helvetica","bold"); doc.setTextColor(95,95,95); doc.text(k,14,y);
    doc.setFont("helvetica","normal"); doc.setTextColor(25,25,25);
    doc.text(String(v).slice(0,74),66,y); y+=6;
  }
  function para(t){
    const lines=doc.splitTextToSize(String(t).replace(/\u00B0/g," deg "),W-28);
    lines.forEach(l=>{ if(y>Hh-18){ doc.addPage(); y=22; } doc.text(l,14,y); y+=5; });
    y+=2;
  }

  section("Site record");
  pair("Place type",h.placeType||"unclassified land use");
  pair("Region",placeOf(h));
  pair("Coordinates",h.latitude.toFixed(4)+" N, "+h.longitude.toFixed(4)+" E");
  pair("Custodian",h.operator||"not on record");
  y+=2;

  section("Detection");
  pair("Satellite",h.satellite);
  pair("Brightness temperature",h.brightness+" K");
  pair("Detection confidence",h.confidence+"%");
  pair("Fire radiative power",h.frp?h.frp+" MW":"not reported");
  pair("Passes in 2 km cluster",String(h.persistence));
  pair("Night detections",Math.round((h.night_ratio||0)*100)+"%");
  pair("First seen",fmtTime(h.first_at||h.detected_at));
  pair("Last seen",fmtTime(h.detected_at)+" ("+ago(h.detected_at)+")");
  y+=2;

  section("Assessment");
  pair("Status",nat.label);
  pair("Fire classification",ft);
  pair("Risk grade",h.risk_level);
  y+=1; para(nat.why); para(assessment(h));

  section("Recommended action");
  actions(h).forEach((a2,i)=>para((i+1)+". "+a2));

  section("Notification");
  pair("Responding body",d.n);
  pair("Helpline",d.ph);
  pair("Email",d.em);

  const v=S.verified.filter(x=>x.id===h.id);
  if(v.length){ section("Ground verification");
    v.forEach(x=>pair(x.status==="confirmed"?"Confirmed":"False alarm",fmtTime(x.at))); }

  const pages=doc.internal.getNumberOfPages();
  for(let p=1;p<=pages;p++){
    doc.setPage(p); doc.setFontSize(7.2); doc.setTextColor(140,140,140);
    doc.text("Fire data: NASA FIRMS. Land use: OpenStreetMap contributors. Satellite classification is advisory and requires ground verification.",14,Hh-10);
    doc.text("Page "+p+" of "+pages,W-14,Hh-10,{align:"right"});
  }
  doc.save("TVG_Report_"+String(h.nearby_facility).replace(/[^A-Za-z0-9]/g,"_").slice(0,32)+".pdf");
  if(id!=="manual") S.reports.unshift({id:"r"+Date.now(),hid:h.id,name:h.nearby_facility,
    cls:h.classification,risk:h.risk_level,at:new Date().toISOString()});
}

/* ============================== ROUTER ============================== */
const GUARDED=["#/dashboard","#/map","#/hotspot","#/alerts","#/analytics","#/investigate","#/watchlist","#/history","#/reports","#/settings"];
function teardown(){
  fxStop(); killCharts();
  const md=document.getElementById("sendmodal"); if(md) md.remove();
  ["map","imap","hmap","wmap"].forEach(k=>{ if(S[k]){ try{S[k].remove();}catch(e){} S[k]=null; } });
}
function render(){
  const app=document.getElementById("app"); if(!app) return;
  try{
    const r=location.hash||"#/"; S.route=r;
    teardown();

    if(!SS.get("tvg_splash")&&!window._sp){
      window._sp=1; app.innerHTML=splash(); initFlame(); runSplash();
      if(DATA.status==="idle") loadData();
      return;
    }
    if(GUARDED.some(p=>r.indexOf(p)===0)&&!user()){ location.hash="#/login"; return; }

    let html;
    if(r==="#/"||r==="") html=landing();
    else if(r==="#/login") html=auth("login");
    else if(r==="#/register") html=auth("register");
    else if(r.indexOf("#/dashboard")===0) html=dashboard();
    else if(r.indexOf("#/map")===0) html=mapPage();
    else if(r.indexOf("#/hotspot/")===0) html=hotspotPage(decodeURIComponent(r.slice(10)));
    else if(r.indexOf("#/alerts")===0) html=alertsPage();
    else if(r.indexOf("#/analytics")===0) html=analyticsPage();
    else if(r.indexOf("#/investigate")===0) html=investigatePage();
    else if(r.indexOf("#/watchlist")===0) html=watchlistPage();
    else if(r.indexOf("#/history")===0) html=historyPage();
    else if(r.indexOf("#/reports")===0) html=reportsPage();
    else if(r.indexOf("#/settings")===0) html=settingsPage();
    else html=landing();

    app.innerHTML=html;
    window.scrollTo(0,0);
    requestAnimationFrame(initFX);

    if(r==="#/") setTimeout(initWorldMap,120);
    if(r.indexOf("#/dashboard")===0){ setTimeout(initDashMap,60); setTimeout(()=>runSituation(false),40); }
    if(r.indexOf("#/map")===0) setTimeout(initMapPage,60);
    if(r.indexOf("#/hotspot/")===0) setTimeout(()=>initDetailMap(decodeURIComponent(r.slice(10))),60);
    if(r.indexOf("#/analytics")===0) setTimeout(initCharts,90);
    if(r.indexOf("#/investigate")===0) setTimeout(()=>{
      initInvMap();
      if(window._coord){ document.getElementById("ilat").value=window._coord[0];
        document.getElementById("ilon").value=window._coord[1]; window._coord=null; investigate(); }
    },60);

    if(user()&&DATA.status==="idle") loadData();
  }catch(err){
    console.error(err);
    app.innerHTML='<div style="max-width:640px;margin:14vh auto;padding:26px;text-align:center">'+
      '<h1 style="font-family:var(--font-display);color:hsl(var(--ember));font-size:20px;font-weight:800">This screen hit an error</h1>'+
      '<p style="margin-top:10px;opacity:.75;font-size:13px">'+esc(err&&err.message?err.message:String(err))+'</p>'+
      '<p style="margin-top:18px"><a href="#/" style="color:hsl(var(--ember));font-weight:600">Back to home</a></p></div>';
  }
}

/* ============================== EVENTS ============================== */
document.addEventListener("click",e=>{
  const btn=e.target.closest(".btn-fluid,.btn-solid");
  if(btn&&!reduced()){
    const r=btn.getBoundingClientRect(), s=document.createElement("span");
    s.className="ripple"; s.style.left=(e.clientX-r.left)+"px"; s.style.top=(e.clientY-r.top)+"px";
    s.style.width=s.style.height=Math.max(r.width,r.height)/3+"px";
    btn.appendChild(s); setTimeout(()=>s.remove(),640);
  }
  const t=e.target.closest("[data-a]"); if(!t) return;
  const a=t.dataset.a;
  if(a==="theme"){ e.preventDefault(); toggleTheme(); }
  else if(a==="signout"){ e.preventDefault(); signOut(); }
  else if(a==="menu"){ e.preventDefault(); const d=document.getElementById("drawer"); if(d) d.classList.toggle("hidden"); }
  else if(a==="refresh"){ e.preventDefault(); DATA.status="idle"; loadData(true); }
  else if(a==="livetoggle"){ e.preventDefault();
    S.live=!S.live; LS.set("tvg_live", S.live?"1":"0");
    AI.model=null; AI.status="idle"; AI.briefs={}; AI.situation=""; AI.sitKey="";
    DATA.status="idle"; DATA.diag=[];
    render(); loadData(false); }
  else if(a==="diag"){ e.preventDefault(); const d=document.getElementById("diagbox"); if(d) d.classList.toggle("hidden"); }
  else if(a==="tile"){ e.preventDefault(); S.tile=t.dataset.v;
    swapTiles(S.map); swapTiles(S.hmap); swapTiles(S.wmap); swapTiles(S.imap);
    document.querySelectorAll('[data-a="tile"]').forEach(b=>{
      const on=b.dataset.v===S.tile;
      b.className="chip "+(on?"text-white":"glass-soft text-dim");
      b.style.background=on?"linear-gradient(120deg,hsl(var(--flame)),hsl(var(--ember)))":""; }); }
  else if(a==="heat"){ e.preventDefault(); S.heat=!S.heat; applyHeat(S.map,S.heat);
    t.className="chip glass-soft "+(S.heat?"text-ember":"text-dim"); t.textContent="Heat "+(S.heat?"on":"off"); }
  else if(a==="filter"){ e.preventDefault(); S.filter=t.dataset.v;
    document.querySelectorAll('[data-a="filter"]').forEach(b=>{
      const on=b.dataset.v===S.filter;
      b.className="chip "+(on?"text-white":"glass-soft text-dim");
      b.style.background=on?"linear-gradient(120deg,hsl(var(--flame)),hsl(var(--ember)))":""; });
    drawMarkers(); paintHotlist(); }
  else if(a==="pdf"){ e.preventDefault(); makePDF(t.dataset.v); }
  else if(a==="verify"){ e.preventDefault();
    const h=hotspots().find(x=>x.id===t.dataset.v); if(!h) return;
    S.verified.push({id:h.id,status:t.dataset.s,at:new Date().toISOString(),
      name:h.nearby_facility,where:placeOf(h)});
    render(); }
  else if(a==="ai-sit"){ e.preventDefault(); runSituation(true); }
  else if(a==="ai-alert"){ e.preventDefault();
    const id=t.dataset.v, out=document.getElementById("ab-"+id);
    const h=hotspots().find(x=>x.id===id); if(!out||!h) return;
    out.innerHTML='<span class="text-dim">Writing</span>';
    briefFor(h,false).then(x=>{ const el=document.getElementById("ab-"+id); if(el) el.textContent=x; }); }
  else if(a==="preset"){ e.preventDefault();
    document.getElementById("ilat").value=t.dataset.lat;
    document.getElementById("ilon").value=t.dataset.lon; }
  else if(a==="goinv"){ window._coord=[t.dataset.lat,t.dataset.lon]; }
  else if(a==="scrolldown"){ e.preventDefault();
    const v=document.getElementById("vidsec");
    if(v) v.scrollIntoView({behavior:reduced()?"auto":"smooth",block:"start"});
    else window.scrollBy({top:window.innerHeight*.85,behavior:"smooth"}); }
  else if(a==="send"){ e.preventDefault(); sendModal(t.dataset.v); }
  else if(a==="dosend"){ e.preventDefault(); doSend(t.dataset.v); }
  else if(a==="copy"){ e.preventDefault(); copyAlert(t.dataset.v); }
  else if(a==="closemodal"){ e.preventDefault(); const m=document.getElementById("sendmodal"); if(m) m.remove(); }
  else if(a==="rewrite"){ e.preventDefault();
    const h=(t.dataset.v==="manual"&&S.manual)?S.manual:hotspots().find(x=>x.id===t.dataset.v);
    if(h) typeReport(h,false); }
});
document.addEventListener("submit",e=>{
  if(e.target.id==="authform"){ e.preventDefault(); doAuth(e.target); }
  else if(e.target.id==="invform"){ e.preventDefault(); investigate(); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ const m=document.getElementById("sendmodal"); if(m) m.remove(); } });
window.addEventListener("hashchange",render);
let rz; window.addEventListener("resize",()=>{ clearTimeout(rz); rz=setTimeout(()=>{
  ["map","imap","hmap","wmap"].forEach(k=>{ if(S[k]) S[k].invalidateSize(); }); },220); },{passive:true});
setInterval(()=>{ if(user()&&DATA.status!=="loading") loadData(false); },REFRESH_MS);

if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",render);
else render();
</script>
