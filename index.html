<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#07080c" />
<title>ThermoVision Guard AI — Smart Fire Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
  window.tailwind = window.tailwind || {};
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      colors: {
        bg: 'hsl(var(--bg))', surface: 'hsl(var(--surface))', line: 'hsl(var(--line))',
        ink: 'hsl(var(--ink))', dim: 'hsl(var(--dim))', ember: 'hsl(var(--ember))',
        flame: 'hsl(var(--flame))', danger: 'hsl(var(--danger))'
      },
      fontFamily: { display: ['var(--font-display)'], sans: ['var(--font-body)'] }
    } }
  };
</script>
<style>
/* ============================ DESIGN TOKENS ============================ */
:root{
  /* swap these two lines to change the whole project's typography */
  --font-display:'Sora',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;

  --bg:222 40% 4%;      --surface:222 34% 7%;   --line:222 22% 15%;
  --ink:210 40% 97%;    --dim:216 16% 62%;
  --ember:22 96% 56%;   --flame:12 92% 58%;     --danger:0 84% 62%;
  --glass:222 34% 10%;  --glass-a:.55;
  --shadow:0 24px 60px -28px rgba(0,0,0,.85);
}
html.light{
  --bg:30 30% 98%;      --surface:0 0% 100%;    --line:24 16% 88%;
  --ink:222 30% 12%;    --dim:220 12% 42%;
  --ember:22 92% 48%;   --flame:12 88% 50%;     --danger:0 74% 48%;
  --glass:0 0% 100%;    --glass-a:.72;
  --shadow:0 20px 44px -26px rgba(30,20,10,.32);
}
*{-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-body); background:hsl(var(--bg)); color:hsl(var(--ink));
  overflow-x:hidden; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.font-display{font-family:var(--font-display);letter-spacing:-.02em}
#app{min-height:100vh}

/* ============================ GLASS SURFACES ============================ */
.glass{
  background:hsl(var(--glass)/var(--glass-a));
  border:1px solid hsl(var(--line)/.9);
  backdrop-filter:blur(18px) saturate(1.4);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);
  box-shadow:var(--shadow);
}
.glass-soft{
  background:hsl(var(--glass)/.34);
  border:1px solid hsl(var(--line)/.7);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.hair{border:1px solid hsl(var(--line)/.8)}
.ember-text{
  background:linear-gradient(100deg,hsl(var(--ember)),hsl(var(--flame)) 55%,hsl(38 96% 62%));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.ember-glow{text-shadow:0 0 32px hsl(var(--ember)/.45)}

/* ============================ NAV GLOW ============================ */
.nav-shell{position:sticky;top:0;z-index:60;padding:10px 0}
.nav-glow{position:relative;border-radius:18px;overflow:hidden}
.nav-glow::before{
  content:"";position:absolute;inset:-140%;z-index:0;
  background:conic-gradient(from 0deg,transparent 0 62%,hsl(var(--flame)/.95) 74%,hsl(var(--ember)) 82%,transparent 92% 100%);
  animation:navspin 7s linear infinite;
}
.nav-glow::after{
  content:"";position:absolute;inset:1px;border-radius:17px;z-index:1;
  background:hsl(var(--glass)/.86);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
.nav-inner{position:relative;z-index:2}
@keyframes navspin{to{transform:rotate(1turn)}}
.nav-link{position:relative;transition:color .25s}
.nav-link.on{color:hsl(var(--ember))}
.nav-link.on::after{
  content:"";position:absolute;left:12px;right:12px;bottom:2px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,hsl(var(--ember)),transparent);
}

/* ============================ FLUID GLASS BUTTON ============================ */
.btn-fluid{
  position:relative;overflow:hidden;isolation:isolate;border-radius:14px;
  background:hsl(var(--glass)/.5);border:1px solid hsl(var(--line));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:transform .28s cubic-bezier(.22,1,.36,1),box-shadow .28s,border-color .28s;
}
.btn-fluid::before{
  content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .3s;
  background:radial-gradient(120% 140% at 30% 0%,hsl(var(--ember)/.34),transparent 60%);
}
.btn-fluid::after{
  content:"";position:absolute;top:0;left:-140%;width:60%;height:100%;z-index:-1;
  background:linear-gradient(100deg,transparent,hsl(0 0% 100%/.22),transparent);
  transition:left .6s cubic-bezier(.22,1,.36,1);
}
.btn-fluid:hover{transform:translateY(-2px);border-color:hsl(var(--ember)/.5);box-shadow:0 14px 34px -18px hsl(var(--ember)/.7)}
.btn-fluid:hover::before{opacity:1}
.btn-fluid:hover::after{left:140%}
.btn-fluid:active{transform:translateY(0) scale(.985)}
.btn-solid{
  position:relative;overflow:hidden;border-radius:14px;color:#fff;border:0;
  background:linear-gradient(120deg,hsl(var(--flame)),hsl(var(--ember)));
  box-shadow:0 14px 34px -16px hsl(var(--ember)/.85);
  transition:transform .28s cubic-bezier(.22,1,.36,1),box-shadow .28s;
}
.btn-solid::after{
  content:"";position:absolute;top:0;left:-140%;width:55%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
  transition:left .65s cubic-bezier(.22,1,.36,1);
}
.btn-solid:hover{transform:translateY(-2px);box-shadow:0 20px 44px -16px hsl(var(--ember)/.95)}
.btn-solid:hover::after{left:150%}
.ripple{position:absolute;border-radius:999px;transform:translate(-50%,-50%) scale(0);
  background:radial-gradient(circle,hsl(0 0% 100%/.5),transparent 65%);
  animation:rip .62s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:translate(-50%,-50%) scale(9);opacity:0}}

/* ============================ SCROLL REVEAL / 3D ============================ */
.rv{opacity:0;transform:translate3d(0,28px,0);transition:opacity .8s cubic-bezier(.22,1,.36,1),transform .8s cubic-bezier(.22,1,.36,1)}
.rv.tilt{transform:perspective(900px) rotateX(10deg) translate3d(0,34px,0)}
.rv.left{transform:translate3d(-30px,0,0)}
.rv.right{transform:translate3d(30px,0,0)}
.rv.zoom{transform:scale(.94)}
.rv.on{opacity:1;transform:none}
.tilt3d{transform-style:preserve-3d;transition:transform .5s cubic-bezier(.22,1,.36,1),box-shadow .5s,border-color .5s;will-change:transform}
.tilt3d .lift{transform:translateZ(38px)}
.tilt3d:hover{border-color:hsl(var(--ember)/.42);box-shadow:0 28px 60px -30px hsl(var(--ember)/.6)}
.parallax{will-change:transform}

/* ============================ FLAME CANVAS BG ============================ */
.flame-bg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.grid-bg{
  position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(hsl(var(--ember)/.055) 1px,transparent 1px),
                   linear-gradient(90deg,hsl(var(--ember)/.055) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(120% 90% at 50% 10%,#000 20%,transparent 78%);
  -webkit-mask-image:radial-gradient(120% 90% at 50% 10%,#000 20%,transparent 78%);
}

/* ============================ SECTION MORPH ============================ */
.morph{position:relative;overflow:hidden}
.morph .blob{
  position:absolute;filter:blur(70px);opacity:.5;will-change:transform,border-radius;
  background:radial-gradient(circle at 30% 30%,hsl(var(--flame)/.85),hsl(var(--ember)/.25) 60%,transparent 72%);
  animation:morphA 16s ease-in-out infinite;
}
.morph .blob.b2{background:radial-gradient(circle at 60% 40%,hsl(38 96% 58%/.6),transparent 68%);animation:morphB 21s ease-in-out infinite}
@keyframes morphA{
  0%,100%{border-radius:58% 42% 40% 60%/48% 56% 44% 52%;transform:translate3d(0,0,0) scale(1)}
  50%{border-radius:38% 62% 63% 37%/60% 38% 62% 40%;transform:translate3d(4%,-4%,0) scale(1.14)}
}
@keyframes morphB{
  0%,100%{border-radius:44% 56% 52% 48%/56% 44% 56% 44%;transform:translate3d(0,0,0) scale(1.05)}
  50%{border-radius:62% 38% 36% 64%/42% 60% 40% 58%;transform:translate3d(-6%,5%,0) scale(.92)}
}

/* ============================ DEPTH BLUR CAROUSEL ============================ */
.dbc-view{position:relative;overflow:hidden;perspective:1400px;padding:34px 0}
.dbc-track{display:flex;gap:22px;will-change:transform;padding:0 6vw}
.dbc-card{
  flex:0 0 300px;height:400px;position:relative;border-radius:24px;overflow:hidden;
  border:1px solid hsl(var(--line));background:hsl(var(--surface));
  transition:filter .45s ease,opacity .45s ease,transform .45s cubic-bezier(.22,1,.36,1);
  will-change:transform,filter,opacity;
}
.dbc-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.1s cubic-bezier(.22,1,.36,1)}
.dbc-card .veil{position:absolute;inset:0;background:linear-gradient(to top,hsl(var(--bg)) 4%,hsl(var(--bg)/.72) 38%,transparent 78%)}
.dbc-card .body{position:absolute;left:0;right:0;bottom:0;padding:20px}
.dbc-card:hover img{transform:scale(1.07)}
.dbc-view:hover .dbc-track{animation-play-state:paused}
.dbc-fade{position:absolute;top:0;bottom:0;width:14vw;z-index:3;pointer-events:none}
.dbc-fade.l{left:0;background:linear-gradient(90deg,hsl(var(--bg)),transparent)}
.dbc-fade.r{right:0;background:linear-gradient(270deg,hsl(var(--bg)),transparent)}
@keyframes marquee{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}
.marq{animation:marquee 46s linear infinite}

/* ============================ VIDEO FRAMES ============================ */
.vframe{position:relative;overflow:hidden;border:1px solid hsl(var(--line));box-shadow:var(--shadow);background:hsl(var(--surface))}
.vframe video{width:100%;height:100%;object-fit:cover;display:block}
.vframe.land{aspect-ratio:16/9;border-radius:30px}
.vframe.mid{aspect-ratio:4/5;border-radius:34px}
.vframe::after{content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 0 1px hsl(0 0% 100%/.06),inset 0 -70px 90px -60px hsl(var(--bg));border-radius:inherit}
.vframe .vfallback{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:24px;
  background:radial-gradient(120% 120% at 50% 0%,hsl(var(--ember)/.16),transparent 60%),hsl(var(--surface))}
.vframe.missing .vfallback{display:grid}
.vframe.missing video{opacity:0}

/* ============================ TYPING ============================ */
.type-caret::after{content:"";display:inline-block;width:2px;height:1em;margin-left:3px;
  background:hsl(var(--ember));vertical-align:-.12em;animation:caret .9s steps(1) infinite}
@keyframes caret{50%{opacity:0}}

/* ============================ GLOBE ============================ */
.globe-wrap{position:relative;width:100%;aspect-ratio:1/1;max-width:460px;margin-inline:auto}
.globe-wrap canvas{width:100%;height:100%;display:block}
.globe-ring{position:absolute;inset:6%;border-radius:50%;border:1px dashed hsl(var(--ember)/.22);animation:spin 38s linear infinite}
.globe-ring.r2{inset:-2%;border-color:hsl(var(--ember)/.12);animation-duration:64s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(1turn)}}

/* ============================ MAPS ============================ */
.leaflet-container{background:#05070c;font-family:var(--font-body)}
html.light .leaflet-container{background:#e8eaf0}
.leaflet-container .leaflet-control-attribution{
  background:hsl(var(--glass)/.7)!important;color:hsl(var(--dim))!important;
  font-size:9px!important;backdrop-filter:blur(8px);border-radius:6px 0 0 0;padding:1px 6px!important
}
.leaflet-container .leaflet-control-attribution a{color:hsl(var(--ember))!important}
.leaflet-tile{filter:none}
.map-shell{position:relative;border-radius:24px;overflow:hidden;border:1px solid hsl(var(--line));box-shadow:var(--shadow)}
.map-skeleton{position:absolute;inset:0;z-index:1;display:grid;place-items:center;pointer-events:none;
  background:
    radial-gradient(60% 60% at 50% 40%,hsl(var(--ember)/.07),transparent 70%),
    linear-gradient(hsl(var(--line)/.5) 1px,transparent 1px) 0 0/40px 40px,
    linear-gradient(90deg,hsl(var(--line)/.5) 1px,transparent 1px) 0 0/40px 40px,
    hsl(var(--bg));
  transition:opacity .6s ease}
.map-skeleton.gone{opacity:0}
.leaflet-popup-content-wrapper{background:hsl(var(--surface));color:hsl(var(--ink));border:1px solid hsl(var(--line));
  border-radius:16px;box-shadow:var(--shadow)}
.leaflet-popup-tip{background:hsl(var(--surface));border:1px solid hsl(var(--line))}
.leaflet-popup-content{margin:12px 14px;font-size:12.5px;line-height:1.5}
.leaflet-bar a{background:hsl(var(--surface));color:hsl(var(--ink));border-color:hsl(var(--line))}
.leaflet-bar a:hover{background:hsl(var(--glass))}
.pulse-marker{position:relative}
@keyframes hotpulse{0%{box-shadow:0 0 0 0 var(--hc)}70%{box-shadow:0 0 0 16px transparent}100%{box-shadow:0 0 0 0 transparent}}
.hot-dot{border-radius:50%;animation:hotpulse 2.2s ease-out infinite}

/* ============================ CHARTS ============================ */
.chart-box{position:relative;width:100%;height:260px}
.chart-box>canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
.chart-box.tall{height:300px}

/* ---------- HERO MARK ---------- */
.hero-mark{width:100%;max-width:420px;height:auto;display:block;margin-inline:auto;
  animation:floaty 6s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@media(max-width:1023px){.hero-mark{max-width:230px}}
.scroll-cue{display:grid;place-items:center;gap:7px;color:hsl(var(--dim));transition:color .3s}
.scroll-cue:hover{color:hsl(var(--ember))}
.scroll-cue .arw{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;
  border:1px solid hsl(var(--line));background:hsl(var(--glass)/.5);animation:bob 1.9s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.85}50%{transform:translateY(7px);opacity:1}}

/* ---------- WORLD DOT MAP ---------- */
.worldmap{position:relative;width:100%;aspect-ratio:2/1;overflow:hidden}
.worldmap canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block}
.worldmap .wm-logo{position:absolute;left:50%;top:50%;translate:-50% -50%;width:26%;max-width:150px;
  opacity:.13;pointer-events:none}

/* ---------- DARK BASEMAP (keyless, filtered) ---------- */
.dark-tiles{filter:invert(1) hue-rotate(192deg) brightness(.93) contrast(1.05) saturate(.5)}
html.light .dark-tiles{filter:none}
.leaflet-heat-layer{pointer-events:none}
.map-label{background:hsl(var(--glass)/.9);border:1px solid hsl(var(--line));color:hsl(var(--ink));
  border-radius:999px;padding:3px 10px;font-size:11px;font-weight:600;white-space:nowrap;
  box-shadow:var(--shadow);backdrop-filter:blur(10px)}
.map-label.risk{border-color:hsl(var(--danger)/.6);color:hsl(var(--danger))}

/* ---------- MODAL ---------- */
.modal-back{position:fixed;inset:0;z-index:200;background:hsl(var(--bg)/.72);backdrop-filter:blur(8px);
  display:grid;place-items:center;padding:18px;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal-card{width:100%;max-width:460px;animation:popin .35s cubic-bezier(.22,1,.36,1)}
@keyframes popin{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}

/* ---------- HERO VIDEO ---------- */
.hero-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:.70;transform:scale(1.04)}
html.light .hero-video{opacity:.52}
.hero-video-fallback{position:absolute;inset:0;z-index:-1;opacity:.55}
html.light .hero-video-fallback{opacity:.42}
.hero-scrim{background:linear-gradient(to bottom,hsl(var(--bg)/.30),hsl(var(--bg)/.62) 55%,hsl(var(--bg)))}
html.light .hero-scrim{background:linear-gradient(to bottom,hsl(var(--bg)/.46),hsl(var(--bg)/.74) 55%,hsl(var(--bg)))}

/* ---------- LIGHT THEME LEGIBILITY ---------- */
html.light .dbc-card{box-shadow:0 10px 30px -18px rgba(20,30,45,.35)}
html.light .dbc-card .veil{background:linear-gradient(to top,hsl(var(--bg)) 6%,hsl(var(--bg)/.86) 42%,hsl(var(--bg)/.18) 78%)}
html.light .dbc-fade.l{background:linear-gradient(90deg,hsl(var(--bg)),hsl(var(--bg)/.0))}
html.light .dbc-fade.r{background:linear-gradient(270deg,hsl(var(--bg)),hsl(var(--bg)/.0))}
html.light .dbc-view{--dbc-blur:2.6px}
html.light .vframe::after{box-shadow:inset 0 0 0 1px rgba(20,30,45,.10),inset 0 -50px 70px -60px hsl(var(--bg))}
html.light .grid-bg{opacity:.55}
html.light .flame-bg{opacity:.75}

/* ============================ MISC ============================ */
.thin::-webkit-scrollbar{width:6px;height:6px}
.thin::-webkit-scrollbar-thumb{background:hsl(var(--ember)/.32);border-radius:999px}
.thin::-webkit-scrollbar-track{background:transparent}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;
  font-size:11px;font-weight:600;letter-spacing:.02em}
.live-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.7);animation:hotpulse 2s infinite;--hc:rgba(34,197,94,.55)}
.skel{background:linear-gradient(90deg,hsl(var(--line)/.35),hsl(var(--line)/.7),hsl(var(--line)/.35));
  background-size:200% 100%;animation:shim 1.4s linear infinite;border-radius:8px}
@keyframes shim{to{background-position:-200% 0}}
.sheet{max-height:78vh}
@media (max-width:640px){
  .dbc-card{flex:0 0 240px;height:330px}
  .chart-box{height:230px}
  .globe-wrap{max-width:320px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.12s!important}
  .rv{opacity:1!important;transform:none!important}
}
</style>
<script>
(function(){try{var t=localStorage.getItem('tvg-theme');if(t==='light')document.documentElement.classList.add('light');}catch(e){}})();
</script>

<body>
<div id="app"></div>
<script>

function mulberry(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }

function buildScenario(idx){
  const sc=SCENARIOS[idx%SCENARIOS.length], rnd=mulberry(sc.seed);
  const sats=["N20","N21","N","Aqua","Terra"], out=[];
  SITES.forEach(s=>{
    const head=sc.headline.indexOf(s.n)>=0;
    const w=s.w*(sc.bias[s.cls]||1)*(head?3:1);
    if(!head && rnd()>w) return;
    const n=Math.max(1,Math.round(sc.density[0]+rnd()*(sc.density[1]-sc.density[0])))+(head?3:0);
    for(let k=0;k<n;k++){
      const bK=Math.round(s.k+(rnd()-.42)*26+(head?14:0));
      const hrs=+(rnd()*22).toFixed(2);
      out.push({
        latitude:+(s.lat+(rnd()-.5)*.014).toFixed(4),
        longitude:+(s.lon+(rnd()-.5)*.014).toFixed(4),
        brightness:Math.max(276,bK),
        confidence:Math.round(60+rnd()*39),
        satellite:sats[Math.floor(rnd()*sats.length)],
        source:"VIIRS",
        frp:+(3+rnd()*(s.cls==="Industrial Fire"?110:38)).toFixed(1),
        daynight:(sc.id==="pass-B"?(rnd()>.2?"N":"D"):(rnd()>.42?"D":"N")),
        detected_at:new Date(Date.now()-hrs*3600e3).toISOString(),
        site:s
      });
    }
  });
  return out;
}

/* ---- what is actually burning: nature + specific fire classification ---- */
function fireNature(h){
  if(h.brightness>=340&&h.frp>=20) return {label:"Active open fire",tone:"danger",
    why:"Brightness above 340 K with high radiative power is consistent with open flame rather than warm surface."};
  if(h.brightness>=318&&h.frp>=8) return {label:"Active fire, moderate intensity",tone:"warn",
    why:"Brightness and radiative power are both above the flaming-combustion threshold."};
  if(h.persistence>=4&&h.brightness<318) return {label:"Persistent heat source, no confirmed flame",tone:"info",
    why:"A steady moderate signature repeating across passes usually indicates process heat or smouldering, not open fire."};
  return {label:"Thermal anomaly, unconfirmed",tone:"info",
    why:"The signature is above background but below the threshold at which flaming combustion can be asserted."};
}
function fireType(h){
  const t=(h.placeType||"").toLowerCase(), c=h.classification;
  if(/flar/.test(t)) return "Hydrocarbon flare combustion (Class B)";
  if(/refinery/.test(t)) return "Refinery flare or hydrocarbon release (Class B)";
  if(/chemical|dye|pharma|bulk drug|intermediates/.test(t)) return "Chemical and solvent fire (Class B)";
  if(/tannery|leather/.test(t)) return "Chemical and organic waste fire (Class A/B)";
  if(/landfill|solid waste/.test(t)) return "Municipal solid waste fire, methane driven (Class A)";
  if(/coal seam|colliery|coal field/.test(t)) return "Sub-surface coal seam fire (Class A)";
  if(/steel|smelter|aluminium/.test(t)) return "Industrial process heat, furnace or slag (Class A)";
  if(/thermal power|ash pond/.test(t)) return "Coal or ash handling fire (Class A)";
  if(/textile|dyeing|boiler/.test(t)) return "Boiler and textile waste fire (Class A)";
  if(/port|cargo/.test(t)) return "Bulk cargo or storage fire (Class A)";
  if(/peat/.test(t)) return "Peat ground fire, deep smouldering (Class A)";
  if(c==="Wildfire") return h.brightness>340?"Forest crown fire (Class A)":"Forest surface and litter fire (Class A)";
  if(c==="Agricultural Burning") return "Crop residue burning (Class A)";
  if(c==="Industrial Fire") return "Industrial combustion, source unconfirmed (Class A/B)";
  return "Unclassified thermal source";
}

const PROXIES=[u=>u,
  u=>"https://corsproxy.io/?url="+encodeURIComponent(u),
  u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u),
  u=>"https://thingproxy.freeboard.io/fetch/"+u];

async function fetchText(url,label){
  for(let i=0;i<PROXIES.length;i++){
    try{
      const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),15000);
      const r=await fetch(PROXIES[i](url),{cache:"no-store",signal:ctl.signal});
      clearTimeout(t);
      if(!r.ok){ DATA.diag.push(label+": HTTP "+r.status+(i?" (proxy "+i+")":"")); continue; }
      const txt=await r.text();
      if(txt && txt.toLowerCase().includes("latitude")) return txt;
      DATA.diag.push(label+": "+(txt||"").slice(0,60).replace(/\s+/g," "));
    }catch(e){ DATA.diag.push(label+": "+(e.name==="AbortError"?"timeout":"blocked")+(i?" (proxy "+i+")":"")); }
  }
  return "";
}

function confNum(c){
  if(c===undefined||c===null||c==="") return 50;
  const s=String(c).trim().toLowerCase();
  if(s==="h"||s==="high") return 94;
  if(s==="n"||s==="nominal") return 74;
  if(s==="l"||s==="low") return 42;
  const n=parseFloat(s); return isNaN(n)?50:n;
}

function parseFirmsCsv(text,src){
  const lines=String(text||"").trim().split(/\r?\n/);
  if(lines.length<2) return [];
  const head=lines[0].toLowerCase().split(",").map(s=>s.trim());
  const ix=n=>head.indexOf(n);
  const iLat=ix("latitude"), iLon=ix("longitude");
  if(iLat<0||iLon<0) return [];
  const iB=ix("bright_ti4")>=0?ix("bright_ti4"):ix("brightness");
  const iDate=ix("acq_date"), iTime=ix("acq_time"), iSat=ix("satellite"),
        iConf=ix("confidence"), iFrp=ix("frp"), iDN=ix("daynight");
  const out=[];
  for(let i=1;i<lines.length;i++){
    const c=lines[i].split(",");
    if(c.length<6) continue;
    const lat=parseFloat(c[iLat]), lon=parseFloat(c[iLon]);
    if(isNaN(lat)||isNaN(lon)) continue;
    const t=String(c[iTime]||"0000").padStart(4,"0");
    out.push({
      latitude:lat, longitude:lon,
      brightness:Math.round(parseFloat(c[iB])||0),
      confidence:confNum(c[iConf]),
      satellite:(c[iSat]||src.split("_")[1]||src).trim(),
      source:src,
      frp:Math.round((parseFloat(c[iFrp])||0)*10)/10,
      daynight:(c[iDN]||"").trim(),
      detected_at:(c[iDate]||"")+"T"+t.slice(0,2)+":"+t.slice(2,4)+":00Z"
    });
  }
  return out;
}

/* ============================== CLASSIFY ============================== */
function classify(o){
  const b=o.brightness||0, c=o.confidence||0, p=o.persistence||0;
  const u=String(o.landUse||"").toLowerCase();
  let cls="Unknown";
  if(/(industrial|factory|manufactur|works|refinery|chemical|warehouse|quarry|landfill|petroleum|cement|steel|brick|kiln|power|plant|smelt|foundry|mill)/.test(u)) cls="Industrial Fire";
  else if(/(forest|wood|reserve|national park|tiger|sanctuary|scrub|jungle|peat)/.test(u)) cls="Wildfire";
  else if(/(farm|cropland|orchard|meadow|vineyard|paddy|agricultur|plantation|stubble|sugarcane)/.test(u)) cls="Agricultural Burning";
  const score=b/500 + c/100 + p*0.12 + Math.min(.5,(o.frp||0)/200);
  let risk="Low";
  if(cls==="Industrial Fire" && b>320 && p>=2) risk="High";
  else if(b>345 || score>1.75) risk="High";
  else if(b>300 || score>1.3) risk="Medium";
  return { classification:cls, risk_level:risk, score:+score.toFixed(2) };
}

function clusterDetections(raw){
  const map={};
  raw.forEach(d=>{
    const key=Math.round(d.latitude/CLUSTER_DEG)+"_"+Math.round(d.longitude/CLUSTER_DEG);
    if(!map[key]){
      map[key]={ id:"h"+key, latitude:d.latitude, longitude:d.longitude, brightness:0, confidence:0,
        frp:0, persistence:0, detected_at:d.detected_at, first_at:d.detected_at, sats:{}, nights:0,
        classification:"Unknown", landuse:"", nearby_facility:"Land use not checked yet",
        district:"", region:regionFor(d.latitude,d.longitude), enriched:false };
    }
    const c=map[key];
    c.persistence++; c.sats[d.satellite]=1;
    if(d.daynight==="N") c.nights++;
    if(d.brightness>c.brightness){ c.brightness=d.brightness; c.latitude=d.latitude; c.longitude=d.longitude; }
    if(d.confidence>c.confidence) c.confidence=d.confidence;
    if(d.frp>c.frp) c.frp=d.frp;
    if(d.detected_at>c.detected_at) c.detected_at=d.detected_at;
    if(d.detected_at<c.first_at) c.first_at=d.detected_at;
    if(d.site){
      const t=d.site;
      c.nearby_facility=t.n; c.address=t.a; c.placeType=t.t; c.operator=t.o;
      c.dept=t.d; c.seedClass=t.cls; c.enriched=true;
      c.region=regionFor(t.lat,t.lon);
      c.landuse=t.cls==="Industrial Fire"?"industrial":t.cls==="Wildfire"?"forest":"farmland";
    }
  });
  return Object.values(map).map(c=>{
    c.satellite=Object.keys(c.sats).join(", ")||"VIIRS"; delete c.sats;
    const r=classify({ brightness:c.brightness, confidence:c.confidence, persistence:c.persistence,
                       frp:c.frp, landUse:c.seedClass?c.landuse:"" });
    c.classification=c.seedClass||r.classification;
    c.risk_level=r.risk_level; c.score=r.score;
    if(c.seedClass){ const r2=classify({brightness:c.brightness,confidence:c.confidence,persistence:c.persistence,frp:c.frp,landUse:c.landuse});
      c.risk_level=r2.risk_level; c.score=r2.score; }
    c.night_ratio=c.persistence?+(c.nights/c.persistence).toFixed(2):0;
    c.nature=fireNature(c); c.fireType=fireType(c);
    c.deptInfo=DEPT[c.dept||(c.classification==="Wildfire"?"forest":c.classification==="Industrial Fire"?"pcb":"fire")];
    return c;
  }).sort((a,b)=>b.score-a.score);
}

/* ---------- live NASA FIRMS ingest (toggle on) ---------- */
async function loadLive(){
  DATA.message="Connecting to NASA FIRMS"; paintStatus();
  const raw=[], ok=[];
  for(const reg of REGIONS){
    for(const src of FIRMS_SRC){
      DATA.message="Streaming "+src.replace(/_NRT$/,"")+" over "+reg.name; paintStatus();
      const txt=await fetchText(firmsUrl(src,reg.area,FIRMS_DAYS), reg.name+"/"+src);
      const rows=parseFirmsCsv(txt,src);
      if(rows.length){ ok.push(src+"@"+reg.name); raw.push(...rows); }
    }
    if(raw.length>6000) break;
  }
  if(!raw.length){
    DATA.status="fallback"; DATA.live=false;
    DATA.message="Live feed unreachable. Open over http(s) and check the FIRMS key, or switch Live off.";
    render(); return;
  }
  const seen=new Set(), dedup=[];
  for(const d of raw){
    const k=d.latitude.toFixed(3)+","+d.longitude.toFixed(3)+","+d.detected_at;
    if(seen.has(k)) continue; seen.add(k); dedup.push(d);
  }
  DATA.raw=dedup; DATA.clusters=clusterDetections(dedup);
  DATA.live=true; DATA.status="live"; DATA.sources=ok; DATA.enriched=0;
  DATA.fetchedAt=new Date().toISOString(); DATA.pass="last 24 hours";
  DATA.message=DATA.clusters.length.toLocaleString()+" live clusters from "+
    dedup.length.toLocaleString()+" NASA FIRMS detections \u00B7 last 24 h";
  render();
  enrichClusters();
}

/* ============================== OSM ENRICHMENT ============================== */
function overpassQ(pts,r){
  let q="[out:json][timeout:60];(";
  pts.forEach(p=>{ const a="(around:"+r+","+p.latitude+","+p.longitude+");";
    q+='way["landuse"~"industrial|farmland|forest|orchard|meadow|vineyard|farmyard|quarry|landfill|plantation"]'+a;
    q+='way["man_made"~"works|chimney|petroleum_well|wastewater_plant|kiln"]'+a;
    q+='way["power"="plant"]'+a;
    q+='way["natural"~"wood|scrub"]'+a; });
  return q+");out tags center;";
}
async function enrichClusters(){
  const targets=DATA.clusters.filter(c=>!c.enriched).slice(0,ENRICH_TOP);
  const R=2200, degR=R/111000;
  for(let i=0;i<targets.length;i+=ENRICH_BATCH){
    const batch=targets.slice(i,i+ENRICH_BATCH);
    let els=[];
    try{
      const res=await fetch("https://overpass-api.de/api/interpreter",{method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:"data="+encodeURIComponent(overpassQ(batch,R))});
      els=(await res.json()).elements||[];
    }catch(e){ batch.forEach(c=>{c.nearby_facility="Land-use service unreachable";}); continue; }
    batch.forEach(c=>{
      let best=null,bd=Infinity;
      els.forEach(el=>{ const ctr=el.center; if(!ctr) return;
        const d=Math.hypot(ctr.lat-c.latitude,ctr.lon-c.longitude);
        if(d<bd&&d<=degR){bd=d;best=el;} });
      c.enriched=true;
      if(!best){ c.nearby_facility="No mapped land use within 2 km"; return; }
      const t=best.tags||{};
      const lu=t.landuse||t.man_made||t.power||t.natural||"";
      c.landuse=lu;
      c.nearby_facility=t.name||t["name:en"]||(lu?lu.replace(/_/g," ")+" zone":"Unnamed zone");
      const r=classify({brightness:c.brightness,confidence:c.confidence,persistence:c.persistence,frp:c.frp,
                        landUse:(t.name||"")+" "+lu+" "+(t.industrial||"")});
      c.classification=r.classification; c.risk_level=r.risk_level; c.score=r.score;
    });
    DATA.enriched=Math.min(targets.length,i+batch.length);
    paintStatus();
    await new Promise(r=>setTimeout(r,1100));
  }
  DATA.clusters.sort((a,b)=>b.score-a.score);
  if(location.hash.startsWith("#/map")) { drawMarkers(); paintHotlist(); } else render();
}

/* ============================== GEMINI + FALLBACK WRITER ============================== */
const AI={ model:null, status:"idle", briefs:{}, situation:"", sitKey:"" };
const aiOn = () => !!(typeof S!=="undefined" && S.live && GEMINI_KEY);
const AI_SYS="";

async function remoteCompose(prompt,maxTok){
  if(!aiOn()){ AI.status="local"; return ""; }
  const models=AI.model?[AI.model]:GEMINI_MODELS;
  for(const m of models){
    try{
      const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),20000);
      const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+m+
        ":generateContent?key="+encodeURIComponent(GEMINI_KEY),
        { method:"POST", headers:{"Content-Type":"application/json"}, signal:ctl.signal,
          body:JSON.stringify({
            system_instruction:{parts:[{text:"You write incident briefs for a satellite fire-monitoring platform used by Indian pollution control boards, fire services and forest departments. Plain, direct English for a field officer. Use only the facts given; never invent facility names, causes, casualties or measurements. No markdown. Under 150 words."}]},
            contents:[{role:"user",parts:[{text:prompt}]}],
            generationConfig:{temperature:.35,maxOutputTokens:maxTok||520} }) });
      clearTimeout(t);
      if(!r.ok) continue;
      const j=await r.json();
      const cand=(j.candidates||[])[0];
      const txt=((cand&&cand.content&&cand.content.parts)||[]).map(p=>p.text||"").join("").trim();
      if(txt){ AI.model=m; AI.status="ok"; return txt; }
    }catch(e){}
  }
  AI.status="local"; return "";
}

/* On-device incident writer. Composes only from measured values. */
function writeBrief(h){
  const band = h.brightness>355?"an extreme thermal signature":h.brightness>335?"a strong thermal signature":
               h.brightness>310?"a moderate thermal signature":"a weak but measurable thermal signature";
  const conf = h.confidence>=90?"very high detection confidence":h.confidence>=70?"nominal detection confidence":"low detection confidence";
  const pers = h.persistence>=6?"The source has been re-observed "+h.persistence+" times, which indicates a sustained or repeatedly ignited burn rather than a one-off event.":
               h.persistence>=3?"With "+h.persistence+" separate detections in this cluster, the source is persistent rather than momentary.":
               h.persistence===2?"Two separate passes recorded this source, so it was still active across satellite overpasses.":
               "Only a single pass recorded this source, so persistence cannot yet be established.";
  const night = h.night_ratio>=.6?" Most detections were at night, which is a common signature of unattended or deliberate burning.":"";
  const land = h.enriched
    ? (h.classification==="Unknown"
        ? "OpenStreetMap shows no mapped industrial, forest or farm land use within two kilometres, so the source cannot be attributed with confidence."
        : "Land use around the coordinate was cross-checked against OpenStreetMap and resolves to "+h.nearby_facility+", which supports a classification of "+h.classification.toLowerCase()+".")
    : "Land use has not been cross-checked for this cluster yet, so the classification remains provisional.";
  const act = h.risk_level==="High"
    ? (h.classification==="Industrial Fire"
        ? "Treat this as priority. Dispatch the nearest regional officer for a site inspection, obtain the unit's consent-to-operate and hazardous-waste manifest for the period covering these detections, and photograph the burn area before it is cleared."
        : "Treat this as priority. Alert the divisional fire control room and the nearest range office, and confirm containment status on the ground before the next satellite pass.")
    : h.risk_level==="Medium"
      ? "Log this for follow-up. Schedule a ground verification within the current inspection cycle and watch whether the cluster persists across the next two passes."
      : "No immediate dispatch is indicated. Keep the cluster on watch and escalate only if persistence or brightness rises on subsequent passes.";
  return "Satellite sensors recorded "+band+" of "+h.brightness+" K near "+h.nearby_facility+" in "+placeOf(h)+", with "+conf+" at "+h.confidence+" percent"+
         (h.frp?" and a fire radiative power of "+h.frp+" MW":"")+". "+pers+night+"\n\n"+land+"\n\n"+act;
}

async function briefFor(h,force){
  const key=h.id+"|"+h.detected_at+"|"+h.classification;
  if(!force && AI.briefs[key]) return AI.briefs[key];
  const facts=[
    "Classification: "+h.classification+(h.enriched?" (land use cross-checked)":" (provisional, land use not cross-checked)"),
    "Risk level: "+h.risk_level, "Nearby land use: "+h.nearby_facility+(h.landuse?" (OSM tag: "+h.landuse+")":""),
    "Location: "+placeOf(h)+" at "+h.latitude.toFixed(4)+", "+h.longitude.toFixed(4),
    "Satellite: "+h.satellite+(DATA.live?" (NASA FIRMS near real time)":" (reference scenario, not a live detection)"),
    "Brightness temperature: "+h.brightness+" K", "Confidence: "+h.confidence+"%",
    "Fire radiative power: "+(h.frp?h.frp+" MW":"not reported"),
    "Detections in this 2 km cluster: "+h.persistence,
    "Share of detections at night: "+Math.round((h.night_ratio||0)*100)+"%",
    "Last detected: "+fmtTime(h.detected_at)+" ("+ago(h.detected_at)+")"
  ].join("\n");
  const txt=await remoteCompose("Write an incident brief for this satellite thermal detection.\n\n"+facts+
    "\n\nThree short paragraphs, no labels: what the satellite measured; what the land use implies about the source and how confident that reading is; what the field team should do, proportionate to the risk level.",520);
  const out=txt||writeBrief(h);
  AI.briefs[key]=out;
  return out;
}
const cachedBrief=h=>AI.briefs[h.id+"|"+h.detected_at+"|"+h.classification]||"";

function writeSituation(H){
  const n=H.length, hi=H.filter(h=>h.risk_level==="High").length;
  const ind=H.filter(h=>h.classification==="Industrial Fire").length;
  const wild=H.filter(h=>h.classification==="Wildfire").length;
  const agri=H.filter(h=>h.classification==="Agricultural Burning").length;
  const byReg={}; H.forEach(h=>{byReg[h.region]=(byReg[h.region]||0)+1;});
  const top=Object.entries(byReg).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]+" ("+x[1]+")").join(", ");
  const worst=H[0];
  return "The current window holds "+n+" active thermal clusters, of which "+hi+" are rated high risk. "+
    "By category the split is "+ind+" industrial, "+wild+" wildfire and "+agri+" agricultural, with the remainder still awaiting a land-use check. "+
    "Detection density is concentrated in "+(top||"no single region")+".\n\n"+
    (worst? "The strongest signal is at "+worst.nearby_facility+" in "+placeOf(worst)+", peaking at "+worst.brightness+
      " K across "+worst.persistence+" detections. Attention should go there first, followed by any industrial cluster showing repeat detections across consecutive passes, since persistence at a fixed industrial coordinate is the pattern most likely to indicate routine open burning rather than an accident."
      : "No clusters are currently loaded.");
}

function wrap(t,w){ w=w||88; const out=[]; let line="";
  t.split(" ").forEach(word=>{ if((line+" "+word).trim().length>w){ out.push(line.trim()); line=word; }
    else line+=" "+word; });
  if(line.trim()) out.push(line.trim()); return out; }

function assessment(h){
  const nat=h.nature||fireNature(h);
  const p=[];
  p.push("A thermal anomaly of "+h.brightness+" K was recorded over "+h.nearby_facility+
    " at "+h.confidence+"% detection confidence"+(h.frp?", releasing an estimated "+h.frp+" MW of radiative power":"")+".");
  p.push(nat.why);
  if(h.persistence>=5) p.push("The cluster was re-observed "+h.persistence+
    " times, so this is a sustained or repeatedly ignited source rather than an isolated event.");
  else if(h.persistence>=3) p.push("With "+h.persistence+
    " detections across consecutive passes the source is persistent, not momentary.");
  else p.push("Only "+h.persistence+" pass(es) recorded this source, so persistence is not yet established.");
  if((h.night_ratio||0)>=.6) p.push("Most detections fall after dark, a pattern commonly associated with unattended or deliberate burning rather than a daytime process upset.");
  if(h.classification==="Industrial Fire") p.push("The coordinate resolves to "+(h.placeType||"an industrial parcel")+
    " under "+(h.operator||"an unlisted custodian")+", which places the source inside a regulated premises.");
  if(h.classification==="Wildfire") p.push("The coordinate falls inside "+(h.placeType||"protected forest")+
    ", where spread is governed by slope, wind and fuel load rather than containment barriers.");
  if(h.classification==="Agricultural Burning") p.push("The coordinate falls on "+(h.placeType||"cropland")+
    ", consistent with post-harvest residue burning during the clearing window.");
  return p.join(" ");
}
function actions(h){
  const a=[], hi=h.risk_level==="High";
  if(h.classification==="Industrial Fire"){
    a.push(hi?"Dispatch the regional officer for an immediate site inspection before the burn area is cleared."
             :"Schedule a site inspection within the current cycle.");
    a.push("Obtain the consent-to-operate and the hazardous-waste manifest covering "+fmtTime(h.first_at||h.detected_at)+" onward.");
    a.push("Photograph the burn area, the ash residue and any open pit, with timestamp and GPS enabled.");
    if((h.night_ratio||0)>=.5) a.push("Check the unit's night-shift log against the detection times listed in section 2.");
    a.push("Record the fire type as "+(h.fireType||fireType(h))+" and select suppression media accordingly.");
  } else if(h.classification==="Wildfire"){
    a.push(hi?"Alert the divisional fire control room and the nearest range office immediately."
             :"Inform the range office and place a watcher on the compartment.");
    a.push("Confirm containment status on the ground before the next satellite pass.");
    a.push("Check fire line integrity and the position of the nearest water source.");
    a.push("Warn any settlement or grazing party within two kilometres downwind.");
  } else if(h.classification==="Agricultural Burning"){
    a.push("Log the coordinate against the village revenue record for the burning-season register.");
    a.push("Issue the standing advisory on residue management and note any repeat offence.");
    if(hi) a.push("Escalate to the district officer if the cluster persists across the next two passes.");
  } else {
    a.push("Assign a land-use verification for this coordinate before classification is finalised.");
    a.push("Re-check on the next pass and escalate only if brightness or persistence rises.");
  }
  a.push("Return the ground verification into this incident record so the site history stays current.");
  return a;
}
function alertMessage(h){
  const nat=h.nature||fireNature(h), d=h.deptInfo||DEPT.fire;

    "Last seen "+ago(h.detected_at)+". Route to "+d.n+" ("+d.ph+").\n"+
    "Source: NASA FIRMS via ThermoVision Guard AI.";

/* ============================== HELPERS ============================== */
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function fmtTime(s){ try{ return new Date(s).toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"}); }catch(e){ return String(s); } }
function ago(s){ const m=Math.round((Date.now()-new Date(s).getTime())/60000);
  if(isNaN(m)) return ""; if(m<1) return "just now"; if(m<60) return m+"m ago";
  const h=Math.round(m/60); return h<24?h+"h ago":Math.round(h/24)+"d ago"; }
function placeOf(h){ return [h.district,h.region].filter(Boolean).join(", ")||
  (h.latitude.toFixed(3)+"\u00B0, "+h.longitude.toFixed(3)+"\u00B0"); }
const isLight=()=>document.documentElement.classList.contains("light");
const nfmt=n=>n>=1000?(n/1000).toFixed(n>=10000?0:1)+"k":String(n);

/* ============================== FX ENGINE ============================== */
const FX={ rafs:[], obs:null, io:null };
function fxStop(){ FX.rafs.forEach(id=>cancelAnimationFrame(id)); FX.rafs=[];
  if(FX.io){FX.io.disconnect();FX.io=null;} }
const reduced=()=>window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function initReveal(){
  const els=document.querySelectorAll(".rv:not(.on)");
  if(!("IntersectionObserver" in window)||reduced()){ els.forEach(e=>e.classList.add("on")); return; }
  FX.io=new IntersectionObserver((ents)=>{
    ents.forEach(en=>{ if(en.isIntersecting){
      const d=+(en.target.dataset.delay||0);
      setTimeout(()=>en.target.classList.add("on"),d);
      FX.io.unobserve(en.target); } });
  },{rootMargin:"0px 0px -8% 0px",threshold:.06});
  els.forEach(e=>FX.io.observe(e));
  setTimeout(()=>document.querySelectorAll(".rv:not(.on)").forEach(e=>{
    if(e.getBoundingClientRect().top<innerHeight) e.classList.add("on"); }),260);
}

/* --- 3D pointer tilt --- */
function initTilt(){
  if(reduced()) return;
  document.querySelectorAll(".tilt3d").forEach(card=>{
    const max=+(card.dataset.tilt||8);
    let raf=null;
    const move=e=>{
      const r=card.getBoundingClientRect();
      const px=(e.clientX-r.left)/r.width-.5, py=(e.clientY-r.top)/r.height-.5;
      if(raf) cancelAnimationFrame(raf);
      raf=requestAnimationFrame(()=>{
        card.style.transform="perspective(1000px) rotateY("+(px*max)+"deg) rotateX("+(-py*max)+"deg) translateZ(6px)";
      });
    };
    card.addEventListener("pointermove",move);
    card.addEventListener("pointerleave",()=>{ card.style.transform=""; });
  });
}

/* --- parallax on scroll --- */
function initParallax(){
  if(reduced()) return;
  const els=[...document.querySelectorAll("[data-par]")];
  if(!els.length) return;
  let ticking=false;
  const onScroll=()=>{
    if(ticking) return; ticking=true;
    requestAnimationFrame(()=>{
      const vh=innerHeight;
      els.forEach(el=>{
        const r=el.getBoundingClientRect();
        if(r.bottom<-200||r.top>vh+200) return;
        const k=+(el.dataset.par||.14);
        el.style.transform="translate3d(0,"+(((r.top+r.height/2)-vh/2)*-k).toFixed(1)+"px,0)";
      });
      ticking=false;
    });
  };
  window.addEventListener("scroll",onScroll,{passive:true}); onScroll();
}

/* --- typing effect --- */
function typeIn(el,text,speed,done){
  el.textContent=""; el.classList.add("type-caret");

  const ctx=cv.getContext("2d");
  const dpr=Math.min(devicePixelRatio||1,2);
  let S=0, rot=0, alive=true, tick=0;
  function size(){ const r=cv.getBoundingClientRect(); S=Math.max(1,Math.min(r.width,r.height));
    cv.width=S*dpr; cv.height=S*dpr; }

    m:Math.max(1.4,Math.min(4.4,(h.brightness-280)/26))}));
  let cache=pts(), cAt=0;

    const la=lat*Math.PI/180, lo=(lon+rot)*Math.PI/180;

  };

    rot+=reduced()?0:.22;

/* --- depth blur carousel --- */
function initCarousel(){
  const view=document.querySelector(".dbc-view"); if(!view) return;
  const track=view.querySelector(".dbc-track");
  const cards=[...track.querySelectorAll(".dbc-card")];
  if(!reduced()) track.classList.add("marq");
  let raf=null;
  const update=()=>{
    const vr=view.getBoundingClientRect(), mid=vr.left+vr.width/2;
    cards.forEach(c=>{
      const r=c.getBoundingClientRect();
      const d=Math.min(1,Math.abs((r.left+r.width/2)-mid)/(vr.width*.52));
      const bmax=isLight()?2.6:5.5;
      c.style.filter="blur("+(d*d*bmax).toFixed(2)+"px)";
      c.style.opacity=(1-d*.55).toFixed(3);
      c.style.transform="scale("+(1-d*.13).toFixed(3)+") translateZ(0) rotateY("+((r.left+r.width/2<mid?1:-1)*d*7).toFixed(2)+"deg)";
    });
    raf=requestAnimationFrame(update);
  };
  if(!reduced()){ raf=requestAnimationFrame(update); FX.rafs.push(raf); }
  let paused=false;
  view.addEventListener("pointerenter",()=>{track.style.animationPlayState="paused";});
  view.addEventListener("pointerleave",()=>{if(!paused)track.style.animationPlayState="running";});

function initWorldDots(){
  const cv=document.getElementById("worldmap"); if(!cv) return;
  const ctx=cv.getContext("2d");
  const dpr=Math.min(devicePixelRatio||1,2);
  let W=0,H=0,alive=true,t=0;
  const land=[];
  const bits=BigInt("0x"+WORLD_MASK).toString(2).padStart(MASK_W*MASK_H,"0");
  for(let y=0;y<MASK_H;y++) for(let x=0;x<MASK_W;x++)
    if(bits[y*MASK_W+x]==="1") land.push([x,y]);
  function size(){ const r=cv.getBoundingClientRect();
    W=cv.width=Math.max(1,r.width*dpr); H=cv.height=Math.max(1,r.height*dpr); }
  size(); new ResizeObserver(size).observe(cv);
  new IntersectionObserver(e=>alive=e[0].isIntersecting).observe(cv);
  const spots=()=>hotspots().slice(0,150).map((h,i)=>({
    x:(h.longitude+180)/360, y:(90-h.latitude)/180, c:ccOf(h.classification),
    r:Math.max(1.6,Math.min(4.2,(h.brightness-282)/24)), ph:i*.7 }));
  let cache=spots(), at=Date.now();
  (function loop(){
    FX.rafs.push(requestAnimationFrame(loop));
    if(!alive) return;
    t+=.03;
    if(Date.now()-at>4000){ cache=spots(); at=Date.now(); }
    ctx.clearRect(0,0,W,H);
    const cw=W/MASK_W, ch=H/MASK_H, d=Math.min(cw,ch)*.36;
    ctx.fillStyle=isLight()?"rgba(120,96,80,.42)":"rgba(255,150,70,.20)";
    land.forEach(p=>{ ctx.beginPath(); ctx.arc(p[0]*cw+cw/2,p[1]*ch+ch/2,d,0,6.283); ctx.fill(); });
    cache.forEach(sp=>{
      const x=sp.x*W, y=sp.y*H;
      const tw=.55+Math.sin(t*2.1+sp.ph)*.45;
      const r=sp.r*dpr*(.85+tw*.35);
      const g=ctx.createRadialGradient(x,y,0,x,y,r*6);
      g.addColorStop(0,sp.c); g.addColorStop(1,"transparent");
      ctx.globalAlpha=.34*tw; ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(x,y,r*6,0,6.283); ctx.fill();
      ctx.globalAlpha=.55+tw*.45; ctx.fillStyle=sp.c;
      ctx.beginPath(); ctx.arc(x,y,r,0,6.283); ctx.fill();
      ctx.globalAlpha=1;
    });
  })();
}

/* --- depth blur carousel --- */
function initCarousel(){
  const view=document.querySelector(".dbc-view"); if(!view) return;
  const track=view.querySelector(".dbc-track");
  const cards=[...track.querySelectorAll(".dbc-card")];
  if(!reduced()) track.classList.add("marq");
  let raf=null;
  const update=()=>{
    const vr=view.getBoundingClientRect(), mid=vr.left+vr.width/2;
    cards.forEach(c=>{
      const r=c.getBoundingClientRect();
      const d=Math.min(1,Math.abs((r.left+r.width/2)-mid)/(vr.width*.52));
      c.style.filter="blur("+(d*d*5.5).toFixed(2)+"px)";
      c.style.opacity=(1-d*.55).toFixed(3);
      c.style.transform="scale("+(1-d*.13).toFixed(3)+") translateZ(0) rotateY("+((r.left+r.width/2<mid?1:-1)*d*7).toFixed(2)+"deg)";
    });
    raf=requestAnimationFrame(update);
  };
  if(!reduced()){ raf=requestAnimationFrame(update); FX.rafs.push(raf); }
  let paused=false;
  view.addEventListener("pointerenter",()=>{track.style.animationPlayState="paused";});
  view.addEventListener("pointerleave",()=>{if(!paused)track.style.animationPlayState="running";});
}

/* --- video frames: show a styled fallback if the mp4 is missing --- */
function initVideos(){
  document.querySelectorAll(".vframe video").forEach(v=>{
    v.muted=true; v.defaultMuted=true; v.loop=true; v.playsInline=true;
    const fail=()=>v.closest(".vframe").classList.add("missing");
    v.addEventListener("error",fail);
    v.addEventListener("loadeddata",()=>v.closest(".vframe").classList.remove("missing"));
    const p=v.play(); if(p&&p.catch) p.catch(()=>{});
    setTimeout(()=>{ if(v.readyState===0) fail(); },2600);
  });
}

function initFX(){ initReveal(); initTilt(); initParallax(); initTyping();
  initFlame(); initGlobe(); initWorldDots(); initCarousel(); initVideos(); }

/* ============================== NAV / SHELL ============================== */
const LINKS=[["#/dashboard","Dashboard"],["#/map","Live Map"],["#/alerts","Alerts"],
             ["#/analytics","Analytics"],["#/investigate","Investigate"],
             ["#/watchlist","Watchlist"],["#/history","History"],["#/reports","Reports"]];

function brand(size,stack){
  return '<span class="relative shrink-0"><span class="absolute inset-0 rounded-xl blur-md opacity-60" style="background:radial-gradient(circle,hsl(var(--ember)/.55),transparent 70%)"></span>'+
    '<img src="'+LOGO_MARK+'" alt="TVG" class="relative '+size+' rounded-xl object-cover ring-1 ring-white/10"></span>'+
    (stack?'<span class="leading-none"><span class="block font-display text-[13px] font-extrabold tracking-tight"><span class="ember-text">THERMO</span>VISION</span>'+
      '<span class="mt-1 block text-[8.5px] font-semibold tracking-[.34em] text-dim">GUARD AI</span></span>':"");
}

function nav(){
  const u=user();
  const links=LINKS.map(([h,l])=>{
    const on=S.route===h||(h!=="#/dashboard"&&S.route.indexOf(h)===0);
    return '<a href="'+h+'" class="nav-link '+(on?"on":"text-dim hover:text-ink")+' rounded-lg px-3 py-2 text-[13px] font-medium">'+l+'</a>';
  }).join("");
  const right=u
    ? '<a href="#/settings" class="btn-fluid hidden h-9 w-9 place-items-center text-dim hover:text-ink sm:grid">&#9881;</a>'+
      '<button data-a="signout" class="btn-fluid hidden h-9 items-center px-3 text-[13px] text-dim hover:text-ink sm:flex">Sign out</button>'
    : '<a href="#/login" class="hidden text-[13px] text-dim hover:text-ink sm:block">Log in</a>'+
      '<a href="#/register" class="btn-solid hidden px-4 py-2 text-[13px] font-semibold sm:block">Get started</a>';
  return '<div class="nav-shell px-3 sm:px-5"><div class="mx-auto max-w-7xl"><div class="nav-glow"><div class="nav-inner flex h-14 items-center justify-between px-3 sm:px-4">'+
    '<a href="#/" class="flex items-center gap-2.5">'+brand("h-9 w-9",true)+'</a>'+
    '<nav class="hidden items-center gap-0.5 xl:flex">'+links+'</nav>'+
    '<div class="flex items-center gap-2">'+
      '<button data-a="theme" title="Theme" class="btn-fluid grid h-9 w-9 place-items-center text-dim hover:text-ink">'+(isLight()?"&#9728;":"&#9790;")+'</button>'+
      right+
      '<button data-a="menu" aria-label="Menu" class="btn-fluid grid h-9 w-9 place-items-center text-dim xl:hidden">&#9776;</button>'+
    '</div></div></div>'+
    '<div id="drawer" class="mt-2 hidden xl:hidden"><div class="glass rounded-2xl p-2">'+
      LINKS.map(([h,l])=>'<a href="'+h+'" class="block rounded-xl px-3 py-2.5 text-sm text-dim hover:bg-white/5 hover:text-ink">'+l+'</a>').join("")+
      (u?'<a href="#/settings" class="block rounded-xl px-3 py-2.5 text-sm text-dim">Settings</a><button data-a="signout" class="block w-full rounded-xl px-3 py-2.5 text-left text-sm text-dim">Sign out</button>'
        :'<a href="#/login" class="block rounded-xl px-3 py-2.5 text-sm text-dim">Log in</a><a href="#/register" class="block rounded-xl px-3 py-2.5 text-sm text-ember">Get started</a>')+
    '</div></div></div></div>';
}

const shell=(inner,wide)=>'<div class="min-h-screen">'+nav()+
  '<main class="mx-auto '+(wide?"max-w-[1500px]":"max-w-7xl")+' px-4 pb-16 pt-4 sm:px-6">'+inner+'</main></div>';

function head(eyebrow,title,sub){
  return '<div class="rv"><p class="text-[11px] font-semibold uppercase tracking-[.32em] text-ember">'+eyebrow+'</p>'+
    '<h1 class="mt-2 font-display text-[26px] font-bold sm:text-[32px]">'+title+'</h1>'+
    (sub?'<p class="mt-1.5 max-w-2xl text-sm text-dim">'+sub+'</p>':'')+'</div>';
}

/* ============================== SPLASH ============================== */
function splash(){
  return '<div class="fixed inset-0 z-[999] grid place-items-center overflow-hidden" style="background:hsl(var(--bg))">'+
    '<canvas class="flame-bg"></canvas><div class="grid-bg"></div>'+
    '<div class="relative flex flex-col items-center px-6 text-center">'+
    '<div class="relative"><div class="absolute inset-0 rounded-3xl blur-2xl" style="background:radial-gradient(circle,hsl(var(--ember)/.6),transparent 70%)"></div>'+
    '<img src="'+LOGO_MARK+'" class="relative h-28 w-28 rounded-3xl object-cover ring-1 ring-white/10" alt="TVG"></div>'+
    '<h1 class="mt-7 font-display text-2xl font-extrabold tracking-tight"><span class="ember-text ember-glow">THERMO</span>VISION</h1>'+
    '<p class="mt-1.5 text-[10px] font-semibold tracking-[.42em] text-dim">GUARD AI</p>'+
    '<p id="sptxt" class="mt-5 h-5 text-xs text-dim"></p>'+
    '<div class="mt-6 h-[3px] w-64 overflow-hidden rounded-full" style="background:hsl(var(--line))">'+
    '<div id="spbar" class="h-full rounded-full" style="width:0%;background:linear-gradient(90deg,hsl(var(--flame)),hsl(var(--ember)))"></div></div></div></div>';
}
function runSplash(){
  const t0=Date.now(), dur=2600;
  const el=document.getElementById("sptxt");
  if(el) typeIn(el,"Linking to satellite thermal feed",30);
  const iv=setInterval(()=>{
    const p=Math.min(100,(Date.now()-t0)/dur*100);
    const b=document.getElementById("spbar"); if(b) b.style.width=p+"%";
    if(p>=100){ clearInterval(iv); SS.set("tvg_splash","1"); render(); }
  },40);
}

/* ============================== LANDING ============================== */
function landing(){
  const u=user();
  const feats=[
    [IMG_F_MAP,"Live thermal map","Every satellite detection over India and the world, colour-coded by what is actually burning."],
    [IMG_F_INGEST,"NASA FIRMS ingest","VIIRS and MODIS thermal anomalies pulled straight from NASA, refreshed on every pass."],
    [IMG_F_LANDUSE,"Land-use classification","Each hotspot is cross-checked against OpenStreetMap to separate factory from forest."],
    [IMG_F_PERSIST,"Persistence tracking","Repeat detections at one coordinate build a score. Habits become visible."],
    [IMG_F_BRIEF,"AI incident briefs","Plain-language briefs written for the officer who has to drive to the site."],
    [IMG_F_REPORT,"Compliance reports","One click turns a satellite pixel into a timestamped, signable PDF."]
  ];
  const cards=feats.concat(feats).map(f=>
    '<article class="dbc-card">'+imgTag(f[0],"")+'<div class="veil"></div>'+
    '<div class="body"><h3 class="font-display text-[15px] font-semibold">'+f[1]+'</h3>'+
    '<p class="mt-1.5 text-[12.5px] leading-relaxed text-dim">'+f[2]+'</p></div></article>').join("");

  const steps=[
    [IMG_W_INGEST,"Ingest","Four sensors across three satellites stream thermal anomalies. TVG pulls them for India first, then the rest of the world."],
    [IMG_W_CLUSTER,"Cluster","Detections within about two kilometres merge into one hotspot. The merge count becomes a persistence score."],
    [IMG_W_CROSSREF,"Cross-reference","OpenStreetMap land use within two kilometres names the likely source and drives the classification."],
    [IMG.f,"Report","An AI brief and a compliance PDF turn the reading into something a field officer can act on."]
  ].map((s,i)=>
    '<article class="tilt3d rv tilt glass rounded-3xl p-1.5" data-tilt="7" data-delay="'+(i*90)+'">'+
    '<div class="relative h-36 overflow-hidden rounded-[20px]">'+imgTag(s[0],"h-full w-full object-cover")+
    '<div class="absolute inset-0" style="background:linear-gradient(to top,hsl(var(--surface)),transparent 70%)"></div>'+
    '<span class="lift absolute right-3 top-3 grid h-8 w-8 place-items-center rounded-full text-[13px] font-bold text-white" style="background:linear-gradient(120deg,hsl(var(--flame)),hsl(var(--ember)))">'+(i+1)+'</span></div>'+
    '<div class="lift p-4"><h3 class="font-display text-[15px] font-semibold">'+s[1]+'</h3>'+
    '<p class="mt-1.5 text-[12.5px] leading-relaxed text-dim">'+s[2]+'</p></div></article>').join("");

  return '<div>'+nav()+

  /* HERO */
  '<section class="relative overflow-hidden px-4 pb-10 pt-10 sm:pt-16">'+
    '<div class="absolute inset-0"><div class="absolute inset-0 overflow-hidden" data-par=".06">'+
      '<video class="hero-video" src="'+VIDEO_TVG+'" poster="'+IMG.hero+'" autoplay muted loop playsinline preload="auto"></video>'+
      imgTag(IMG.hero,"hero-video-fallback h-[128%] w-full -translate-y-[8%] object-cover")+'</div>'+
    '<div class="hero-scrim absolute inset-0"></div>'+
    '<canvas class="flame-bg"></canvas><div class="grid-bg"></div></div>'+
    '<div class="relative mx-auto max-w-6xl">'+
      '<div class="grid items-center gap-8 lg:grid-cols-[1.08fr_.92fr] lg:gap-10">'+
        '<div class="order-2 text-center lg:order-1 lg:text-left">'+
          '<div class="rv chip glass-soft mb-6 text-ember"><span class="live-dot"></span>Live NASA FIRMS feed</div>'+
          '<h1 class="rv font-display text-[34px] font-extrabold leading-[1.08] sm:text-[50px]">Turning satellite thermal signals into <span class="ember-text ember-glow">smart fire intelligence</span></h1>'+
          '<p class="mt-6 max-w-2xl text-[15px] leading-relaxed text-dim sm:text-base" data-type="ThermoVision Guard AI watches every industrial estate, forest reserve and cropland belt from orbit, tells you what is burning, and remembers who keeps burning it." data-type-speed="17" data-type-delay="500"></p>'+
          '<div class="rv mt-9 flex flex-col items-center gap-3 sm:flex-row sm:justify-center lg:justify-start" data-delay="240">'+
            '<a href="#/register" class="btn-solid w-full px-7 py-3.5 text-[15px] font-semibold sm:w-auto">Open the live dashboard</a>'+
            '<a href="#/login" class="btn-fluid w-full px-7 py-3.5 text-[15px] font-semibold sm:w-auto">Official login</a>'+
            (u?'<a href="#/dashboard" class="text-sm font-medium text-ember hover:underline">Continue &#8594;</a>':'')+
          '</div>'+
        '</div>'+
        '<div class="rv zoom order-1 lg:order-2" data-delay="120">'+
          '<img src="'+LOGO_HERO+'" alt="ThermoVision Guard AI" class="hero-mark">'+
        '</div>'+
      '</div>'+
      '<div class="relative mt-12 flex justify-center"><button data-a="scrolldown" class="scroll-cue" aria-label="Scroll down">'+
        '<span class="text-[10px] font-semibold uppercase tracking-[.28em]">Scroll</span>'+
        '<span class="arw">&#8595;</span></button></div>'+

function doAuth(f){
  const login=f.dataset.mode==="login";
  const em=(document.getElementById("email").value||"").trim();
  const pw=document.getElementById("password").value||"";
  const err=document.getElementById("autherr");
  const bad=m=>{ err.textContent=m; err.classList.remove("hidden"); };
  if(!/^\S+@\S+\.\S+$/.test(em)) return bad("Enter a valid email address.");
  if(pw.length<6) return bad("Password must be at least 6 characters.");
  if(!login && pw!==(document.getElementById("confirm").value||"")) return bad("The two passwords do not match.");
  signIn(em); location.hash="#/dashboard"; render();
  if(DATA.status==="idle") loadData();
}

/* ============================== MAP ENGINE ============================== */
const TILES={
  dark:["https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png","&copy; OpenStreetMap",19,"dark-tiles"],
  satellite:["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}","Esri World Imagery",19,""],
  streets:["https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png","&copy; OpenStreetMap",19,""]
};
const BLANK="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";

function baseLayer(key){
  const t=TILES[key]||TILES.dark;
  return L.tileLayer(t[0],{ attribution:t[1], maxZoom:t[2], minZoom:2, errorTileUrl:BLANK,
    className:t[3]||"", updateWhenIdle:true, keepBuffer:2 });
}
function makeMap(id,opts){
  const el=document.getElementById(id); if(!el||typeof L==="undefined") return null;
  const m=L.map(id,Object.assign({ zoomControl:true, scrollWheelZoom:true, preferCanvas:true,
    worldCopyJump:true, minZoom:2, maxZoom:19, zoomSnap:.5, wheelPxPerZoomLevel:110,
    maxBounds:[[-85,-200],[85,200]], maxBoundsViscosity:.6 },opts||{}));
  m.setView([22.4,79],(opts&&opts.z)||4.5);
  baseLayer(S.tile).addTo(m);
  const sk=document.getElementById(id+"-sk");
  m.whenReady(()=>setTimeout(()=>{ if(sk) sk.classList.add("gone"); m.invalidateSize(); },420));
  m.on("load",()=>{ if(sk) sk.classList.add("gone"); });
  setTimeout(()=>{ m.invalidateSize(); if(sk) sk.classList.add("gone"); },700);
  return m;
}
function swapTiles(m){
  if(!m) return;
  m.eachLayer(l=>{ if(l instanceof L.TileLayer) m.removeLayer(l); });
  baseLayer(S.tile).addTo(m);
}
function heatPoints(){
  const src=DATA.raw.length?DATA.raw:hotspots();
  return src.map(d=>[d.latitude,d.longitude,Math.max(.15,Math.min(1,(d.brightness-280)/95))]);
}
function plotHotspots(m,list,withPopup){
  if(!m) return;
  m.eachLayer(l=>{ if(l instanceof L.CircleMarker) m.removeLayer(l); });
  list.forEach(h=>{
    const c=ccOf(h.classification);
    const mk=L.circleMarker([h.latitude,h.longitude],{
      radius:Math.max(3.5,Math.min(15,(h.brightness-278)/11+h.persistence*.5)),
      color:c, weight:1.1, opacity:.95, fillColor:c, fillOpacity:.42 }).addTo(m);
    if(withPopup) mk.bindPopup(
      '<div style="min-width:210px">'+
      '<div style="display:flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:50%;background:'+c+'"></span>'+
      '<b style="color:'+c+'">'+esc(h.classification)+'</b><span style="opacity:.6">&#183; '+h.risk_level+'</span></div>'+
      '<div style="margin-top:6px;font-weight:600">'+esc(h.nearby_facility)+'</div>'+
      '<div style="opacity:.65">'+esc(placeOf(h))+'</div>'+
      '<div style="margin-top:6px">Brightness <b>'+h.brightness+' K</b> &#183; Confidence <b>'+h.confidence+'%</b></div>'+
      '<div>Detections <b>'+h.persistence+'</b>'+(h.frp?' &#183; FRP <b>'+h.frp+' MW</b>':'')+'</div>'+
      '<div style="opacity:.65">'+esc(h.satellite)+' &#183; '+ago(h.detected_at)+'</div>'+

/* Custom canvas heat overlay. No plugin, so it always renders. */
const HeatLayer = (typeof L!=="undefined") ? L.Layer.extend({
  initialize:function(pts){ this._pts=pts||[]; },
  setPoints:function(p){ this._pts=p||[]; this._draw(); return this; },
  onAdd:function(map){
    this._map=map;
    this._cv=L.DomUtil.create("canvas","leaflet-heat-layer leaflet-layer");
    const p=map.getPanes().overlayPane; p.appendChild(this._cv);
    map.on("moveend zoomend resize viewreset",this._reset,this);
    if(map.options.zoomAnimation && L.Browser.any3d) map.on("zoomanim",this._anim,this);
    this._reset();
  },
  onRemove:function(map){
    map.off("moveend zoomend resize viewreset",this._reset,this);
    map.off("zoomanim",this._anim,this);
    if(this._cv&&this._cv.parentNode) this._cv.parentNode.removeChild(this._cv);
  },
  _anim:function(e){
    const off=this._map._getCenterOffset(e.center)._multiplyBy(-e.scale).subtract(this._map._getMapPanePos());
    if(L.DomUtil.setTransform) L.DomUtil.setTransform(this._cv,off,e.scale);
  },
  _reset:function(){
    const tl=this._map.containerPointToLayerPoint([0,0]);
    L.DomUtil.setPosition(this._cv,tl);
    const sz=this._map.getSize();
    if(this._cv.width!==sz.x) this._cv.width=sz.x;
    if(this._cv.height!==sz.y) this._cv.height=sz.y;
    this._cv.style.width=sz.x+"px"; this._cv.style.height=sz.y+"px";
    this._draw();
  },
  _draw:function(){
    if(!this._map||!this._cv) return;
    const ctx=this._cv.getContext("2d"), sz=this._map.getSize();
    ctx.clearRect(0,0,sz.x,sz.y);
    const z=this._map.getZoom();
    const R=Math.max(16,Math.min(70,10+z*5.5));
    ctx.globalCompositeOperation="lighter";
    const b=this._map.getBounds().pad(.25);
    this._pts.forEach(p=>{
      if(p[0]<b.getSouth()||p[0]>b.getNorth()||p[1]<b.getWest()||p[1]>b.getEast()) return;
      const q=this._map.latLngToContainerPoint([p[0],p[1]]);
      const i=Math.max(.12,Math.min(1,p[2]));
      let g=ctx.createRadialGradient(q.x,q.y,0,q.x,q.y,R);
      g.addColorStop(0,"rgba(255,80,10,"+(0.34*i).toFixed(3)+")");
      g.addColorStop(.45,"rgba(255,150,20,"+(0.17*i).toFixed(3)+")");
      g.addColorStop(1,"rgba(255,180,40,0)");
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(q.x,q.y,R,0,6.283); ctx.fill();
      g=ctx.createRadialGradient(q.x,q.y,0,q.x,q.y,R*.28);
      g.addColorStop(0,"rgba(255,244,214,"+(0.62*i).toFixed(3)+")");
      g.addColorStop(1,"rgba(255,190,60,0)");
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(q.x,q.y,R*.28,0,6.283); ctx.fill();
    });
    ctx.globalCompositeOperation="source-over";
  }
}) : null;

function applyHeat(m,on){
  if(!m||!HeatLayer) return;
  if(m._heat){ try{ m.removeLayer(m._heat); }catch(e){} m._heat=null; }
  if(on){ m._heat=new HeatLayer(heatPoints()); m.addLayer(m._heat); }
}

function typeReport(h,instant){
  const box=document.getElementById("reportbox"); if(!box) return;
  const txt=reportText(h);
  if(instant||reduced()){ box.textContent=txt; return; }
  box.textContent=""; box.classList.add("type-caret");
  let i=0; const step=Math.max(6,Math.round(txt.length/420));
  (function tick(){
    if(!document.body.contains(box)) return;
    i=Math.min(txt.length,i+step);
    box.textContent=txt.slice(0,i);
    box.scrollTop=box.scrollHeight;
    if(i<txt.length) setTimeout(tick,12);
    else { box.classList.remove("type-caret"); box.scrollTop=0; }
  })();
}

/* nearest registered site, used to name the coordinate */
function nearestSite(lat,lon){
  let best=null,bd=Infinity;
  SITES.forEach(t=>{
    const d=Math.hypot((t.lat-lat)*111,(t.lon-lon)*111*Math.cos(lat*Math.PI/180));
    if(d<bd){ bd=d; best=t; }
  });
  return { site:best, km:+bd.toFixed(1) };
}

async function investigate(){
  const lat=parseFloat(document.getElementById("ilat").value);
  const lon=parseFloat(document.getElementById("ilon").value);

  const peak=hits.reduce((m,d)=>d.brightness>(m?m.brightness:0)?d:m,null);

  const cells=[["Place name",h.nearby_facility],["Address",h.address],["Place type",h.placeType],
    ["Region",h.region],["Custodian",h.operator],["Coordinates",lat.toFixed(4)+"\u00B0, "+lon.toFixed(4)+"\u00B0"],
    ["Peak brightness",peak?peak.brightness+" K":"\u2014"],["Confidence",peak?peak.confidence+"%":"\u2014"],

    '<span class="chip glass-soft">'+h.risk_level+' risk</span>'+

    '<span class="text-[11px] text-dim">score '+h.score+'</span></div>'+

      '<a href="'+mapsLink(h)+'" target="_blank" rel="noopener" class="btn-fluid px-4 py-2 text-[12px] font-semibold text-dim">Open in Maps</a>'+

  if(S.imap){

function offenders(){
  const m={};
  hotspots().forEach(h=>{
    if(h.classification!=="Industrial Fire") return;
    const k=h.nearby_facility;
    if(!m[k]) m[k]={name:k,where:placeOf(h),hits:0,peak:0,ids:[],lat:h.latitude,lon:h.longitude,last:h.detected_at,night:0};
    m[k].hits+=h.persistence; m[k].ids.push(h.id);
    m[k].peak=Math.max(m[k].peak,h.brightness);
    m[k].night+=(h.night_ratio||0);
    if(h.detected_at>m[k].last) m[k].last=h.detected_at;
  });
  return Object.values(m).map(f=>{
    f.nightAvg=f.ids.length?f.night/f.ids.length:0;
    f.score=Math.min(100,Math.round(f.hits*7+(f.peak>340?18:0)+f.nightAvg*22));
    return f;
  }).sort((a,b)=>b.score-a.score);
}

  }).join(""):'<div class="px-4 py-16 text-center text-sm text-dim">No industrial repeats in this window. Land-use checks may still be running.</div>';

    head("Repeat offenders","High-risk watchlist","Industrial sites ranked by how often, how hot and how late at night they burn.")+
    statusStrip()+
    '<div class="glass overflow-hidden rounded-2xl">'+
      '<div class="hidden grid-cols-12 gap-3 border-b px-4 py-2.5 text-[10px] font-semibold uppercase tracking-wider text-dim sm:grid" style="border-color:hsl(var(--line))">'+
      '<div class="col-span-4">Facility</div><div class="col-span-3">Location</div><div class="col-span-1 text-center">Hits</div>'+
      '<div class="col-span-1 text-center">Confirmed</div><div class="col-span-2">Risk score</div><div class="col-span-1 text-right">Action</div></div>'+
      '<div class="divide-y" style="border-color:hsl(var(--line))">'+rows+'</div></div></div>');
}

/* ============================== HISTORY ============================== */
function historyPage(){
  const ev=S.verified.slice().reverse();
  const items=ev.length?ev.map((v,i)=>{
    const h=hotspots().find(x=>x.id===v.id);
    const ok=v.status==="confirmed";
    return '<div class="rv relative pl-8" data-delay="'+(i*40)+'">'+
      '<span class="absolute left-[9px] top-5 h-full w-px" style="background:hsl(var(--line))"></span>'+
      '<span class="absolute left-0 top-2 grid h-[19px] w-[19px] place-items-center rounded-full text-[10px]" '+
      'style="background:'+(ok?"hsl(var(--danger)/.18);color:hsl(var(--danger))":"hsl(var(--line));color:hsl(var(--dim))")+'">'+(ok?"&#10003;":"&#10007;")+'</span>'+
      '<div class="glass mb-3 rounded-xl p-3.5"><div class="flex flex-wrap items-center justify-between gap-2">'+
      '<p class="text-[13px] font-semibold">'+esc(v.name)+'</p>'+
      '<span class="text-[10.5px] text-dim">'+fmtTime(v.at)+'</span></div>'+
      '<p class="mt-1 text-[11.5px] text-dim">'+esc(v.where)+' &#183; '+(ok?"confirmed on ground":"dismissed as false alarm")+'</p>'+
      (h?'<a href="#/hotspot/'+encodeURIComponent(v.id)+'" class="mt-2 inline-block text-[11.5px] font-medium text-ember">Open incident &#8594;</a>':
          '<p class="mt-2 text-[11px] text-dim">Cluster has left the current window.</p>')+'</div></div>';
  }).join(""):'<div class="glass rounded-2xl px-4 py-16 text-center"><p class="text-sm text-dim">No verifications recorded yet.</p>'+
      '<p class="mt-1 text-[11.5px] text-dim">Confirm or dismiss an incident and it will appear here.</p>'+
      '<a href="#/alerts" class="btn-fluid mt-4 inline-block px-4 py-2 text-[12.5px]">Go to alerts</a></div>';
  const stats=[["Total actions",S.verified.length],["Confirmed",S.verified.filter(v=>v.status==="confirmed").length],
    ["False alarms",S.verified.filter(v=>v.status!=="confirmed").length],["Reports filed",S.reports.length]]
    .map(s=>'<div class="glass rounded-2xl p-4"><p class="text-[10.5px] uppercase tracking-wider text-dim">'+s[0]+'</p>'+
      '<p class="mt-1.5 font-display text-[24px] font-extrabold">'+s[1]+'</p></div>').join("");
  return shell('<div class="space-y-4">'+
    head("Audit trail","Verification history","Every confirmation and dismissal, in order.")+
    '<div class="grid grid-cols-2 gap-3 lg:grid-cols-4">'+stats+'</div>'+
    '<div class="mt-2">'+items+'</div></div>');
}

/* ============================== REPORTS ============================== */
function reportsPage(){
  const src=S.reports.length?S.reports:hotspots().slice(0,6).map(h=>({
    id:"seed-"+h.id,hid:h.id,name:h.nearby_facility,cls:h.classification,risk:h.risk_level,at:h.detected_at,seed:true}));
  const cards=src.map((r,i)=>{
    const c=ccOf(r.cls);
    return '<div class="rv glass tilt3d rounded-2xl p-4" data-tilt="6" data-delay="'+(i*40)+'">'+
      '<div class="flex items-start justify-between"><span class="grid h-9 w-9 place-items-center rounded-xl" style="background:'+c+'1c;color:'+c+'">&#9635;</span>'+
      '<span class="chip glass-soft">'+r.risk+'</span></div>'+
      '<h3 class="lift mt-3 truncate text-[13.5px] font-semibold">'+esc(r.name)+'</h3>'+
      '<p class="text-[11.5px] text-dim">'+esc(r.cls)+'</p>'+
      '<p class="mt-1 text-[10.5px] text-dim">'+fmtTime(r.at)+(r.seed?" &#183; not yet generated":"")+'</p>'+
      '<div class="mt-4 flex gap-2"><a href="#/hotspot/'+encodeURIComponent(r.hid)+'" class="btn-fluid flex-1 px-3 py-2 text-center text-[11.5px] font-semibold text-dim">Open</a>'+
      '<button data-a="pdf" data-v="'+esc(r.hid)+'" class="btn-solid px-3 py-2 text-[11.5px] font-semibold">PDF</button></div></div>';
  }).join("");
  return shell('<div class="space-y-4">'+
    head("Compliance archive","Incident reports","Generated PDFs, ready for the enforcement file.")+
    '<div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">'+cards+'</div></div>');
}

  const row=(k,v)=>'<div class="glass-soft rounded-xl p-3"><p class="text-[10.5px] text-dim">'+k+'</p><p class="mt-0.5 text-[12.5px] font-medium">'+v+'</p></div>';

    '<div class="grid gap-4 lg:grid-cols-3">'+

        esc((u.email||"U").charAt(0).toUpperCase())+'</div>'+
        '<div><p class="font-display text-[17px] font-semibold">'+esc(u.name||"Officer")+'</p>'+
