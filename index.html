function classifyHotspot(o) {
  const brightness = o.brightness || 0, confidence = o.confidence || 0, persistence = o.persistence || 0;
  const u = String(o.nearbyLandUse || "").toLowerCase();
  let classification = "Unknown";
  if (/(industrial|factory|manufactur|works|plant|refinery|chemical|warehouse)/.test(u)) classification = "Industrial Fire";
  else if (/(forest|wood|reserve|national park|tiger|sanctuary)/.test(u)) classification = "Wildfire";
  else if (/(farm|farmland|cropland|orchard|meadow|vineyard|paddy|agricultur)/.test(u)) classification = "Agricultural Burning";
  const score = brightness / 500 + confidence / 100 + persistence * 0.12;
  let risk_level = "Low";
  if (classification === "Industrial Fire" && brightness > 320 && persistence >= 2) risk_level = "High";
  else if (brightness > 345 || score > 1.6) risk_level = "High";
  else if (brightness > 300 || score > 1.2) risk_level = "Medium";
  return { classification: classification, risk_level: risk_level, score: +score.toFixed(2) };
}

    "",

  ].join("\n");
}

/* ----------------------------- external data ----------------------------- */
async function lookupLandUse(lat, lon, radius) {
  radius = radius || 3000;
  const q = "[out:json][timeout:25];("
    + 'way["landuse"~"industrial|commercial|retail"](around:' + radius + "," + lat + "," + lon + ");"
    + 'way["man_made"~"works|chimney|factory"](around:' + radius + "," + lat + "," + lon + ");"
    + 'way["landuse"~"forest|farmland|orchard|meadow|vineyard|farmyard"](around:' + radius + "," + lat + "," + lon + ");"
    + 'way["natural"="wood"](around:' + radius + "," + lat + "," + lon + ");"
    + ");out tags center 20;";
  try {
    const res = await fetch("https://overpass-api.de/api/interpreter", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: "data=" + encodeURIComponent(q)
    });
    const j = await res.json();
    const els = j.elements || [];
    if (!els.length) return { nearby_facility: "Unresolved area", landuse: "" };
    let near = els[0], nd = Infinity;
    for (const el of els) {
      const c = el.center || { lat: lat, lon: lon };
      const d = Math.hypot(c.lat - lat, c.lon - lon);
      if (d < nd) { nd = d; near = el; }
    }
    const t = near.tags || {};
    const name = t.name || t["name:en"] || "";
    const lu = t.landuse || t.man_made || t.natural || t.industrial || "";
    return { nearby_facility: name || (lu ? lu.replace(/_/g, " ") + " zone" : "Unnamed zone"), landuse: lu };
  } catch (e) {
    return { nearby_facility: "Lookup unavailable (network blocked)", landuse: "" };
  }
}

function confNum(c) {
  if (!c) return 50;
  const s = String(c).toLowerCase();
  if (s === "h") return 95;
  if (s === "n") return 72;
  if (s === "l") return 45;
  const n = parseFloat(c);
  return isNaN(n) ? 50 : n;
}
function riskB(b) { return b > 345 ? "High" : (b > 320 ? "Medium" : "Low"); }

async function fetchFirms() {
  const area = "68,8,97,37";
  const sources = ["VIIRS_NOAA20_NRT", "MODIS_NRT"];
  const proxy = function (u) { return "https://api.allorigins.win/raw?url=" + encodeURIComponent(u); };
  const out = [];
  for (const src of sources) {
    const u = "https://firms.modaps.eosdis.nasa.gov/api/area/csv/" + FIRMS_KEY + "/" + src + "/" + area + "/1";
    let text = "";
    try {
      const r = await fetch(u);
      if (!r.ok) throw new Error("bad status");
      text = await r.text();
    } catch (e1) {
      try { const r2 = await fetch(proxy(u)); text = await r2.text(); } catch (e2) { continue; }
    }
    const lines = String(text).trim().split("\n");
    if (!lines.length || lines[0].indexOf("Invalid") === 0) continue;
    const cols = lines[0].split(",");
    const bIdx = cols.indexOf("bright_ti4") >= 0 ? cols.indexOf("bright_ti4") : cols.indexOf("brightness");
    if (bIdx < 0) continue;
    for (let i = 1; i < lines.length; i++) {
      const c = lines[i].split(",");
      if (c.length < 10) continue;
      const lat = parseFloat(c[0]), lon = parseFloat(c[1]);
      if (isNaN(lat) || isNaN(lon)) continue;
      const b = parseFloat(c[bIdx]) || 0;
      const t = String(c[6]).padStart(4, "0");
      out.push({
        id: "live-" + src + "-" + i, latitude: lat, longitude: lon, brightness: b,
        confidence: confNum(c[9]), satellite: c[7] || src,
        detected_at: c[5] + "T" + t.slice(0, 2) + ":" + t.slice(2, 4) + ":00Z",
        classification: "Live Detection", risk_level: riskB(b),
        nearby_facility: "Pending OSM cross-check", district: "", state: "", persistence: 1, live: true
      });
    }
  }
  return out;
}

function repeatOffenders() {
  const m = {};
  for (const h of MOCK) {
    if (h.classification !== "Industrial Fire") continue;
    if (!m[h.nearby_facility]) {
      m[h.nearby_facility] = {
        facility: h.nearby_facility, district: h.district, state: h.state,
        count: 0, maxBrightness: 0, lastSeen: h.detected_at, lat: h.latitude, lon: h.longitude, ids: []
      };
    }
    m[h.nearby_facility].count += h.persistence;
    m[h.nearby_facility].ids.push(h.id);
    m[h.nearby_facility].maxBrightness = Math.max(m[h.nearby_facility].maxBrightness, h.brightness);
  }
  return Object.keys(m).map(function (k) {
    const f = m[k];
    f.riskScore = Math.min(100, f.count * 12 + (f.maxBrightness > 340 ? 20 : 0));
    return f;
  }).sort(function (a, b) { return b.riskScore - a.riskScore; });
}

function esc(s) {

function observeReveals() {
  const els = document.querySelectorAll(".reveal:not(.in)");
  if (!("IntersectionObserver" in window)) {
    els.forEach(function (el) { el.classList.add("in"); });
    return;
  }
  const io = new IntersectionObserver(function (ents) {
    ents.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } });
  }, { rootMargin: "0px 0px -60px 0px" });
  els.forEach(function (el) { io.observe(el); });
  setTimeout(function () {
    document.querySelectorAll(".reveal:not(.in)").forEach(function (el) {
      if (el.getBoundingClientRect().top < window.innerHeight) el.classList.add("in");
    });
  }, 300);
}

function runSplash() {
  const start = Date.now(), dur = 2600;
  const iv = setInterval(function () {
    const p = Math.min(100, ((Date.now() - start) / dur) * 100);
    const bar = document.getElementById("spbar"), txt = document.getElementById("sptxt");
    if (bar) bar.style.width = p + "%";
    if (txt) txt.textContent = p < 100 ? "Starting the satellite thermal feed\u2026" : "Ready";
    if (p >= 100) { clearInterval(iv); SS.set("tvg_splashed", "1"); render(); }

function doAuth(form) {
  const isLogin = form.dataset.mode === "login";
  const email = (document.getElementById("email").value || "").trim();
  const pw = document.getElementById("password").value || "";
  const err = document.getElementById("autherr");
  function fail(msg) { err.textContent = msg; err.classList.remove("hidden"); }
  if (!/^\S+@\S+\.\S+$/.test(email)) return fail("Enter a valid email address.");
  if (pw.length < 6) return fail("Passwords need at least 6 characters.");
  if (!isLogin && pw !== (document.getElementById("confirm").value || "")) return fail("The two passwords do not match.");
  login(email);
  location.hash = "#/dashboard";
  render();
}

const TILES = {
  dark: ["https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", "&copy; CARTO"],
  satellite: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", "Esri"],
  streets: ["https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", "&copy; OpenStreetMap"]
};

function initMap() {
  const holder = document.getElementById("leaflet");
  if (!holder || typeof L === "undefined") return;

  const tt = document.getElementById("tiletoggle");
  if (tt) {
    tt.innerHTML = Object.keys(TILES).map(function (k) {
      return '<button type="button" data-act="tile" data-tile="' + k + '" class="px-2.5 py-1.5 rounded-md text-xs font-medium ' + (state.tile === k ? "bg-primary text-primary-foreground" : "text-muted-foreground hover:text-foreground") + '">' + k + "</button>";
    }).join("");
  }

  if (state.map) { try { state.map.remove(); } catch (e) {} state.map = null; }
  state.map = L.map("leaflet", { scrollWheelZoom: true }).setView([22.5, 79], 5);
  L.tileLayer(TILES[state.tile][0], { attribution: TILES[state.tile][1], maxZoom: 18 }).addTo(state.map);
  setTimeout(function () { if (state.map) state.map.invalidateSize(); }, 120);

  drawMapMarkers();

  const list = document.getElementById("hotlist");
  if (list) {
    list.innerHTML = MOCK.map(function (h) {
      const c = CC[h.classification];
      return '<a href="#/hotspot/' + h.id + '" class="block rounded-xl border border-border bg-secondary/50 p-3 hover:border-primary/30 hover:bg-secondary">'
        + '<div class="flex items-center gap-2"><span class="h-2.5 w-2.5 rounded-full" style="background:' + c + ";box-shadow:0 0 10px " + c + '"></span>'
        + '<p class="truncate text-sm font-medium text-foreground">' + esc(h.nearby_facility) + "</p></div>"
        + '<p class="mt-1 text-xs text-muted-foreground">' + esc(h.district) + ", " + esc(h.state) + "</p>"
        + '<div class="mt-2 flex items-center justify-between text-[11px]"><span class="text-muted-foreground">' + h.brightness + "K \u00B7 " + h.confidence + "%</span>"
        + '<span class="rounded px-1.5 py-0.5 font-semibold" style="background:' + c + "22;color:" + c + '">' + h.risk_level + "</span></div></a>";
    }).join("");
  }

  if (!state.live.length && !state.liveLoading) reloadLive();
}

function drawMapMarkers() {
  if (!state.map) return;
  state.map.eachLayer(function (l) { if (l instanceof L.CircleMarker) state.map.removeLayer(l); });

  MOCK.forEach(function (h) {
    const c = CC[h.classification];
    const popup = '<div style="min-width:200px">'
      + '<p style="font-weight:600;color:#ff6600;margin:0">' + esc(h.classification) + "</p>"
      + '<p style="margin:2px 0;font-weight:500">' + esc(h.nearby_facility) + "</p>"
      + '<p style="margin:0;font-size:12px;opacity:.7">' + esc(h.district) + ", " + esc(h.state) + "</p>"
      + '<p style="margin:6px 0 0;font-size:12px">Brightness <b>' + h.brightness + "K</b> \u00B7 Confidence <b>" + h.confidence + "%</b></p>"
      + '<a href="#/hotspot/' + h.id + '" style="display:inline-block;margin-top:8px;font-size:12px;font-weight:600;color:#ff6600">View details \u2192</a></div>';
    L.circleMarker([h.latitude, h.longitude], {
      radius: Math.max(6, h.brightness / 40), color: c, fillColor: c, fillOpacity: 0.6, weight: 1.5
    }).bindPopup(popup).addTo(state.map);
  });

  if (state.showLive) {
    state.live.forEach(function (h) {
      const popup = '<div style="min-width:210px">'
        + '<p style="font-weight:600;color:' + LIVE_COLOR + ';margin:0">\u25CF Live NASA FIRMS detection</p>'
        + '<p style="margin:2px 0;font-size:12px;opacity:.7">' + h.latitude.toFixed(4) + "\u00B0N, " + h.longitude.toFixed(4) + "\u00B0E</p>"
        + '<p style="margin:6px 0 0;font-size:12px">Brightness <b>' + h.brightness + "K</b> \u00B7 Confidence <b>" + h.confidence + "%</b></p>"
        + '<p style="margin:0;font-size:12px">Satellite: ' + esc(h.satellite) + "</p></div>";
      L.circleMarker([h.latitude, h.longitude], {
        radius: Math.max(5, h.brightness / 50), color: LIVE_COLOR, fillColor: LIVE_COLOR, fillOpacity: 0.55, weight: 1.5
      }).bindPopup(popup).addTo(state.map);
    });
  }
}

function reloadLive() {
  state.liveLoading = true;
  const pill = document.getElementById("livepill");
  if (pill) pill.innerHTML = '<span class="h-2 w-2 rounded-full" style="background:' + LIVE_COLOR + '"></span> Loading\u2026';
  fetchFirms().then(function (d) {
    state.live = d;
    state.liveLoading = false;
    const p = document.getElementById("livepill");
    if (p) p.innerHTML = '<span class="h-2 w-2 rounded-full" style="background:' + LIVE_COLOR + '"></span> Live ' + d.length;
    const s = document.getElementById("livestatus");
    if (s) s.textContent = d.length ? (d.length + " live detections in the last 24 hours") : "No live feed right now. Showing the sample dataset. Open this page over http:// for the FIRMS API.";
    drawMapMarkers();
  }).catch(function () {
    state.liveLoading = false;
    const s = document.getElementById("livestatus");
    if (s) s.textContent = "Live feed unreachable. Showing the sample dataset.";
    const p = document.getElementById("livepill");
    if (p) p.innerHTML = '<span class="h-2 w-2 rounded-full" style="background:' + LIVE_COLOR + '"></span> Live 0';
  });

function genPDF(id) {
  const h = MOCK.filter(function (x) { return x.id === id; })[0];
  if (!h) return;
  if (!window.jspdf || !window.jspdf.jsPDF) {
    window.alert("The PDF library did not load. Check your internet connection and reload the page.");
    return;
  }
  const jsPDF = window.jspdf.jsPDF;
  const doc = new jsPDF();
  const w = doc.internal.pageSize.getWidth();

  doc.setFillColor(5, 7, 10); doc.rect(0, 0, w, 30, "F");
  doc.setTextColor(255, 102, 0); doc.setFontSize(16); doc.setFont("helvetica", "bold");
  doc.text("THERMOVISION GUARD AI", 14, 15);
  doc.setTextColor(255, 255, 255); doc.setFontSize(10); doc.setFont("helvetica", "normal");
  doc.text("Incident report", 14, 23);

  doc.setTextColor(20, 20, 20); doc.setFontSize(13); doc.setFont("helvetica", "bold");
  doc.text(h.classification + " \u2014 " + h.risk_level + " risk", 14, 45);
  doc.setFontSize(10); doc.setFont("helvetica", "normal");

  const rows = [
    ["Hotspot ID", h.id], ["Nearby facility", h.nearby_facility],
    ["Location", h.district + ", " + h.state],
    ["Coordinates", h.latitude.toFixed(4) + " N, " + h.longitude.toFixed(4) + " E"],
    ["Satellite", h.satellite], ["Brightness", h.brightness + " K"],
    ["Confidence", h.confidence + "%"], ["Persistence", h.persistence + " scan(s)"],
    ["Detected", time(h.detected_at)], ["Generated", time(new Date().toISOString())]
  ];
  let y = 58;
  rows.forEach(function (r) {
    doc.setFont("helvetica", "bold"); doc.text(r[0] + ":", 14, y);
    doc.setFont("helvetica", "normal"); doc.text(String(r[1]), 60, y);
    y += 9;
  });
  doc.setFont("helvetica", "bold"); doc.text("Incident alert", 14, y + 4);
  doc.setFont("helvetica", "normal");
  doc.text(doc.splitTextToSize(alertText(h).replace(/\u00B0/g, " deg "), w - 28), 14, y + 12);
  doc.save("TVG_Report_" + h.id + ".pdf");

  reports.unshift({
    id: "r" + Date.now(), hotspot_id: h.id, nearby_facility: h.nearby_facility,
    classification: h.classification, risk_level: h.risk_level, created_date: new Date().toISOString()
  });
}

function destroyCharts() {
  Object.keys(state.charts).forEach(function (k) {
    try { if (state.charts[k]) state.charts[k].destroy(); } catch (e) {}
  });
  state.charts = {};
}

function initCharts() {
  if (typeof Chart === "undefined") return;
  destroyCharts();
  const tick = "hsl(var(--muted-foreground))", grid = "hsl(var(--border))";

  const counts = { "Industrial Fire": 0, "Wildfire": 0, "Agricultural Burning": 0, "Unknown": 0 };
  MOCK.forEach(function (h) { counts[h.classification]++; });

  const pieEl = document.getElementById("pie");
  if (pieEl) {
    state.charts.pie = new Chart(pieEl, {
      type: "doughnut",
      data: { labels: Object.keys(counts), datasets: [{ data: Object.keys(counts).map(function (k) { return counts[k]; }), backgroundColor: ["#ff3b30", "#ff9500", "#ffcc00", "#8e8e93"], borderWidth: 0 }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: tick } } } }
    });
  }

  const districts = {};
  MOCK.forEach(function (h) { districts[h.district] = (districts[h.district] || 0) + 1; });
  const distArr = Object.keys(districts).map(function (d) { return [d, districts[d]]; })
    .sort(function (a, b) { return b[1] - a[1]; }).slice(0, 8);

  const barEl = document.getElementById("bar");
  if (barEl) {
    state.charts.bar = new Chart(barEl, {
      type: "bar",
      data: {
        labels: distArr.map(function (d) { return d[0]; }),
        datasets: [{ data: distArr.map(function (d) { return d[1]; }), backgroundColor: "#ff6600", borderRadius: 6 }]
      },
      options: {
        indexAxis: "y", responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { x: { ticks: { color: tick, precision: 0 }, grid: { color: grid } }, y: { ticks: { color: tick }, grid: { display: false } } }
      }
    });
  }
}

function investigate() {
  const lat = parseFloat(document.getElementById("ilat").value);
  const lon = parseFloat(document.getElementById("ilon").value);
  const box = document.getElementById("invresult");
  const btn = document.getElementById("invbtn");

  if (isNaN(lat) || isNaN(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180) {
    box.innerHTML = '<div class="rounded-xl border border-destructive/40 bg-destructive/10 p-4 text-sm text-destructive">Enter a latitude between -90 and 90 and a longitude between -180 and 180.</div>';
    return;
  }

  btn.textContent = "Analysing\u2026"; btn.disabled = true;
  box.innerHTML = "";

  lookupLandUse(lat, lon).then(function (lu) {
    const brightness = 300 + Math.floor(Math.random() * 60);
    const confidence = 70 + Math.floor(Math.random() * 30);
    const r = classifyHotspot({ brightness: brightness, confidence: confidence, nearbyLandUse: lu.nearby_facility + " " + lu.landuse, persistence: 1 });
    const h = {
      id: "manual", latitude: lat, longitude: lon, brightness: brightness, confidence: confidence,
      satellite: "On-demand", detected_at: new Date().toISOString(),
      classification: r.classification, risk_level: r.risk_level,
      nearby_facility: lu.nearby_facility, district: "", state: "", persistence: 1
    };
    const color = CC[r.classification];

    const cells = [
      ["Nearby (OSM)", lu.nearby_facility + (lu.landuse ? " (" + lu.landuse + ")" : "")],
      ["Brightness", brightness + " K"],
      ["Confidence", confidence + "%"]
    ].map(function (d) {
      return '<div class="rounded-xl border border-border bg-secondary/50 p-3"><p class="text-xs text-muted-foreground">' + d[0] + "</p>"
        + '<p class="text-sm font-medium text-foreground">' + esc(d[1]) + "</p></div>";
    }).join("");

    box.innerHTML = '<div class="glass rounded-2xl p-5">'
      + '<div class="flex flex-wrap items-center justify-between gap-3"><div class="flex items-center gap-2">'
      + '<span class="h-3 w-3 rounded-full" style="background:' + color + ";box-shadow:0 0 12px " + color + '"></span>'
      + '<h2 class="text-lg font-bold" style="color:' + color + '">' + r.classification + "</h2>"
      + '<span class="rounded-md bg-secondary px-2 py-0.5 text-xs font-semibold">' + r.risk_level + " risk</span></div>"
      + '<span class="text-xs text-muted-foreground">Score ' + r.score + "</span></div>"
      + '<div class="mt-4 grid gap-3 sm:grid-cols-3">' + cells + "</div>"
      + '<div class="mt-4"><p class="mb-1 text-xs font-semibold uppercase tracking-wider text-muted-foreground">Generated alert</p>'
      + '<pre class="whitespace-pre-wrap rounded-xl border border-border bg-foreground/10 p-4 text-sm leading-relaxed text-foreground/75">' + esc(alertText(h)) + "</pre></div></div>";

    if (typeof L !== "undefined") {
      if (state.imap) { try { state.imap.remove(); } catch (e) {} }
      state.imap = L.map("imap").setView([lat, lon], 9);
      L.tileLayer(TILES.streets[0], { attribution: TILES.streets[1], maxZoom: 18 }).addTo(state.imap);
      L.circleMarker([lat, lon], { radius: 12, color: color, fillColor: color, fillOpacity: 0.6, weight: 2 }).addTo(state.imap);
      setTimeout(function () { if (state.imap) state.imap.invalidateSize(); }, 120);
    }

    btn.textContent = "\uD83D\uDD0D Analyse this location"; btn.disabled = false;
  });
}

    + "</div></div>"
    + '<div class="space-y-4"><div class="glass rounded-2xl p-5"><div class="flex items-center gap-3">' + brandMark("h-10 w-10") + "</div>"
    + '<p class="mt-3 text-xs text-muted-foreground">Industrial fire intelligence platform</p></div>'
    + '<button type="button" data-act="logout" class="flex w-full items-center justify-center gap-2 rounded-2xl border border-border bg-secondary px-4 py-3 text-sm font-semibold text-muted-foreground hover:text-destructive">Sign out</button></div>'
    + "</div></div>");
}

/* ----------------------------- router ----------------------------- */
function render() {
  const app = document.getElementById("app");
  if (!app) return;

  try {
    const route = location.hash || "#/";
    state.route = route;
    destroyCharts();
    if (state.map) { try { state.map.remove(); } catch (e) {} state.map = null; }
    if (state.imap) { try { state.imap.remove(); } catch (e) {} state.imap = null; }

    if (!SS.get("tvg_splashed") && !window._splashed) {
      window._splashed = true;
      app.innerHTML = splashHTML();
      runSplash();
      return;
    }

    const protectedRoutes = ["#/dashboard", "#/map", "#/hotspot", "#/alerts", "#/analytics", "#/investigate", "#/high-risk", "#/reports", "#/settings"];
    const needsAuth = protectedRoutes.some(function (p) { return route.indexOf(p) === 0; });
    if (needsAuth && !user()) { location.hash = "#/login"; return; }

    let html;
    if (route === "#/" || route === "") html = landing();
    else if (route === "#/login") html = authPage("login");
    else if (route === "#/register") html = authPage("register");
    else if (route.indexOf("#/dashboard") === 0) html = dashboard();
    else if (route.indexOf("#/map") === 0) html = mapPage();
    else if (route.indexOf("#/hotspot/") === 0) html = hotspotPage(route.split("/")[2]);
    else if (route.indexOf("#/alerts") === 0) html = alertsPage();
    else if (route.indexOf("#/analytics") === 0) html = analyticsPage();
    else if (route.indexOf("#/investigate") === 0) html = investigatePage();
    else if (route.indexOf("#/high-risk") === 0) html = highRiskPage();
    else if (route.indexOf("#/reports") === 0) html = reportsPage();
    else if (route.indexOf("#/settings") === 0) html = settingsPage();
    else html = landing();

    app.innerHTML = html;
    window.scrollTo(0, 0);
    observeReveals();

    if (route.indexOf("#/map") === 0) setTimeout(initMap, 0);
    if (route.indexOf("#/analytics") === 0) setTimeout(initCharts, 0);
    if (route.indexOf("#/investigate") === 0) {
      setTimeout(function () {
        initInvestigateMap();
        if (window._pendingCoord) {
          document.getElementById("ilat").value = window._pendingCoord[0];
          document.getElementById("ilon").value = window._pendingCoord[1];
          window._pendingCoord = null;
          investigate();
        }
      }, 0);
    }
  } catch (err) {
    app.innerHTML = '<div style="max-width:720px;margin:80px auto;padding:24px;font-family:Inter,sans-serif">'
      + '<h1 style="color:#ff6600;font-size:20px;font-weight:800">Something went wrong on this screen</h1>'
      + '<p style="margin-top:8px;opacity:.8;font-size:14px">' + esc(err && err.message ? err.message : String(err)) + "</p>"
      + '<p style="margin-top:16px"><a href="#/" style="color:#ff6600;font-weight:600">Back to the home page</a></p></div>';
    console.error(err);
  }
}

/* ----------------------------- event delegation ----------------------------- */
document.addEventListener("click", function (e) {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act;

  if (act === "theme") { e.preventDefault(); toggleTheme(); }
  else if (act === "logout") { e.preventDefault(); logout(); }
  else if (act === "mnav") {
    e.preventDefault();
    const m = document.getElementById("mnav");
    if (m) m.classList.toggle("hidden");
  }
  else if (act === "tile") { e.preventDefault(); state.tile = t.dataset.tile; initMap(); }
  else if (act === "toggle-live") { e.preventDefault(); state.showLive = !state.showLive; drawMapMarkers(); }
  else if (act === "reload-live") { e.preventDefault(); reloadLive(); }
  else if (act === "pdf") { e.preventDefault(); genPDF(t.dataset.id); }
  else if (act === "fb") { e.preventDefault(); addFeedback(t.dataset.id, t.dataset.status); }
  else if (act === "preset") {
    e.preventDefault();
    document.getElementById("ilat").value = t.dataset.lat;
    document.getElementById("ilon").value = t.dataset.lon;
  }
  else if (act === "investigate-at") {
    window._pendingCoord = [t.dataset.lat, t.dataset.lon];
  }
});

document.addEventListener("submit", function (e) {
  if (e.target.id === "authform") { e.preventDefault(); doAuth(e.target); }
  else if (e.target.id === "invform") { e.preventDefault(); investigate(); }
});

window.addEventListener("hashchange", render);

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", render);
else render();
</script>
</body>
</html>
